title: Load API keys and tokens from environment only
rule: >-
  Never hardcode provider credentials, API keys, bearer tokens, or
  Tailscale/session secrets in source, scripts, tests, or bridge configs. Read
  them at runtime from process.env (or an injected config/port), fail fast with
  a clear error when a required variable is missing, and keep any secret value
  out of committed files, default objects, and CLI argument strings that get
  logged. This applies to DeepSeek/MiniMax keys, ACP bridge auth, web server
  tokens, and iOS pairing codes.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      const apiKey = process.env.MINIMAX_API_KEY;
      if (!apiKey) throw new Error('MINIMAX_API_KEY is not set');
      const client = createHttpClient({ apiKey });
    isCorrect: true
  - snippet: |-
      const DEFAULT_CONFIG = {
        minimaxApiKey: 'sk-live-9f3c...',
        bridgeToken: 'clutch-dev-token',
      };
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
