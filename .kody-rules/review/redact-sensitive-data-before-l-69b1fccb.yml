title: Redact sensitive data before logging or sending to Sentry/Datadog
rule: >-
  Do not log or attach raw secrets, tokens, passwords, full request bodies, or
  PII to console, Datadog Logs/RUM, or Sentry events. Use structured logging
  with allow-listed fields (requestId, userId, route) and configure
  beforeSend/beforeBreadcrumb scrubbing for both Sentry and Datadog. Replace
  ad-hoc console.log of user data with the project logger.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      console.log('login', { email, password, token });
      Sentry.captureException(error, { extra: { email, sessionToken: token } });
    isCorrect: false
  - snippet: |-
      logger.info('login_attempt', { requestId, userId: user.id });
      Sentry.captureException(error, { extra: { requestId, userId: user.id } });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
