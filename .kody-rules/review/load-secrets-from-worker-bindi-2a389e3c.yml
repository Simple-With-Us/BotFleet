title: Load secrets from Worker bindings, never hardcode credentials
rule: >-
  All credentials (API keys, tokens, webhook secrets, D1/KV/R2 tokens) must be
  read from the Worker `env` object (bindings declared in
  `wrangler.toml`/`wrangler.jsonc` and typed in an `Env` interface). Never
  inline literal secrets in `.ts` files, never commit them to `wrangler.toml`
  `[vars]`, and never read them from `process.env` inside Worker code. Local
  development secrets belong in a git-ignored `.dev.vars`; production secrets
  are set with `wrangler secret put`. Any string literal that looks like a
  key/token (`sk_*`, `Bearer <token>`, long base64/hex blobs, private keys) is a
  violation.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      const FLEET_API_KEY = "sk_live_9f2b7c41d8e34a6b";

      export default {
        async fetch(request: Request): Promise<Response> {
          return fetch("https://api.fleet.example.com/vehicles", {
            headers: { Authorization: `Bearer ${FLEET_API_KEY}` },
          });
        },
      };
    isCorrect: false
  - snippet: |-
      interface Env {
        FLEET_API_KEY: string;
        FLEET_KV: KVNamespace;
      }

      export default {
        async fetch(request: Request, env: Env): Promise<Response> {
          return fetch("https://api.fleet.example.com/vehicles", {
            headers: { Authorization: `Bearer ${env.FLEET_API_KEY}` },
          });
        },
      };
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
