title: Never write Xcode project files directly — the PreToolUse hook blocks it
rule: >-
  Do not edit or generate Xcode project files (e.g.
  `*.xcodeproj/project.pbxproj`, workspace/project files) directly, and do not
  remove or weaken the guard that enforces this. The repository enforces it with
  a `PreToolUse` hook in `.claude/settings.json` that matches `Edit|Write` and
  runs `python3 .claude/hooks/block-xcode-project-writes.py` (status message
  "Blocking Xcode project file writes"). If a change appears to require touching
  an Xcode project file, change project settings through Xcode or a supported
  tooling path instead, or raise it for review rather than bypassing the hook.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      {
        "hooks": {
          "PreToolUse": [
            {
              "matcher": "Edit|Write",
              "hooks": [
                {
                  "type": "command",
                  "command": "python3 .claude/hooks/block-xcode-project-writes.py",
                  "statusMessage": "Blocking Xcode project file writes"
                }
              ]
            }
          ]
        }
      }
    isCorrect: true
  - snippet: >-
      Edit MyApp.xcodeproj/project.pbxproj to add the new Swift file to the
      target.
    isCorrect: false
  - snippet: >-
      # Instead of editing project.pbxproj by hand, add the file through Xcode
      or supported tooling.
    isCorrect: true
  - snippet: >-
      // Temporarily commenting out the block-xcode-project-writes.py hook so
      the edit goes through.
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
