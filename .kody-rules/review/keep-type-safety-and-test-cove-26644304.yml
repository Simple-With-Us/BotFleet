title: Keep type safety and test coverage for source changes
rule: >-
  Do not bypass the type checker: no @ts-ignore/@ts-nocheck/@ts-expect-error
  used to silence real errors and no `as any` casts in src/. Model unknown input
  with `unknown` plus explicit narrowing/validation (zod-style guards or
  hand-written checks). Every behavior change under src/ (bridges, web server,
  shared ports/contracts) must ship with a matching vitest test so `npm run
  typecheck` and `npm test` stay meaningful; Playwright specs are for end-to-end
  web flows only, not a substitute for unit coverage.
severity: medium
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      export function parseProfile(input: unknown): Profile {
        if (!isProfileShape(input)) throw new Error('invalid profile payload');
        return input;
      }
    isCorrect: true
  - snippet: |-
      // @ts-ignore - payload shape varies
      export function parseProfile(input: any): Profile {
        return input as any;
      }
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
