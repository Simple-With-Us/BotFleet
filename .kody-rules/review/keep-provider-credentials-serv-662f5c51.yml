title: Keep provider credentials server-side and redact them from all logs/telemetry
rule: >-
  Provider API keys, OAuth tokens, webhook secrets, and session tokens must only
  be read in server-only code (route handlers, server actions, workers, scripts)
  and must never be logged, tagged, or attached to error reports. Do not read
  secret env vars in files that can be bundled for the client; add `import
  'server-only'` to modules that touch credentials. Before sending anything to
  Sentry (`beforeSend`/`beforeSendTransaction`), Datadog browser logs/RUM,
  dd-trace spans, or the app logger, strip/redact values for keys matching
  `/key|token|secret|authorization|cookie|password/i`, and log identifiers
  (provider, account id, request id) instead of raw credentials.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      // app/api/collect/route.ts
      export async function POST(req: Request) {
        const key = process.env.ANTHROPIC_API_KEY;
        console.log('polling with key', key);
        captureException(err, { extra: { headers: req.headers } });
      }
    isCorrect: false
  - snippet: |-
      // app/api/collect/route.ts
      import 'server-only';
      import { redact } from '@/lib/logging/redact';

      export async function POST(req: Request) {
        const key = requireEnv('ANTHROPIC_API_KEY');
        logger.info({ provider: 'anthropic', requestId }, 'polling provider');
        captureException(err, { extra: redact({ provider: 'anthropic' }) });
      }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
