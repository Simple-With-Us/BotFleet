title: Never send secrets or user content to telemetry and logs
rule: >-
  Sentry/PostHog initialization must scrub sensitive data before it leaves the
  process: configure `beforeSend`/`beforeBreadcrumb` to strip request headers
  (`authorization`, `cookie`), query strings, environment dumps, API keys,
  tokens, and raw chat prompts/completions. The same applies to `console.*` and
  any structured logger — log identifiers, provider names, and status codes
  instead of credentials or message bodies. Never attach a full config object,
  `process.env`, or an error object that embeds request headers to a telemetry
  call.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      Sentry.init({ dsn, beforeSend: (e) => e });
      Sentry.captureException(err, { extra: { apiKey, prompt: userPrompt } });
      console.log('config', config);
    isCorrect: false
  - snippet: >-
      Sentry.init({
        dsn,
        beforeSend(event) {
          if (event.request?.headers) delete event.request.headers;
          if (event.request?.query_string) event.request.query_string = '[redacted]';
          return event;
        },
        beforeBreadcrumb(b) {
          if (b.data?.url) b.data.url = redactQuery(b.data.url);
          return b;
        },
      });

      Sentry.captureException(err, { tags: { provider: 'openai', phase: 'stream'
      } });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
