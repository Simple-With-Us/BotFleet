title: >-
  Do not change Sparkle feed URL, public key, or CFBundleVersion scheme without
  reading docs/AUTO-UPDATE.md
rule: >-
  Installed copies auto-update from the signed, notarized GitHub release
  published by `.github/workflows/mac-release.yml` for every merge to `main`
  that changes the app. Do not change `SUFeedURL`, `SUPublicEDKey`, or the
  `CFBundleVersion` scheme in `script/build_and_run.sh` without first reading
  `docs/AUTO-UPDATE.md` (keys, hosting, CI secrets, rollback, local update
  rehearsal). A wrong key or a build number that goes backwards silently strands
  every installed copy. `script/build_and_run.sh` is the canonical release
  pipeline — bundling, codesigning, notarizing, stapling, DMG, ZIP + sha — and
  the only path that knows the icon-making and notarial profile; run it once to
  read the contract.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: >-
      # Release build: use the canonical pipeline, leave Sparkle config
      untouched

      ./script/build_and_run.sh
    isCorrect: true
  - snippet: >-
      # Forbidden: rotate the update key / feed URL or regress the build number
      inline

      sed -i '' 's/SUPublicEDKey=.*/SUPublicEDKey=NEW_KEY/'
      script/build_and_run.sh

      CFBundleVersion=1  # build number goes backwards
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
