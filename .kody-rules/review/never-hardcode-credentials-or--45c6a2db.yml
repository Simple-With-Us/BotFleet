title: Never hardcode credentials or secrets in shared code
rule: >-
  This package is consumed by multiple apps, so any secret embedded here leaks
  everywhere. Do not hardcode API keys, tokens, passwords, signing secrets,
  connection strings, or private URLs in source files, constants modules,
  fixtures, or examples. Secrets must be supplied by the consuming application
  at runtime (constructor/config object or environment variables read by the
  consumer) and typed explicitly. Use placeholders like '<REDACTED>' or
  obviously fake values in tests/docs only. If a constant is
  environment-specific (base URLs, tenant IDs, keys), export a config
  type/factory instead of a literal value.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      export const SOCRATIC_API_KEY = "sk_live_9f2b7c41a8de";
      export const JWT_SIGNING_SECRET = "super-secret-value";
      export const DB_URL = "postgres://admin:hunter2@db.internal:5432/prod";
    isCorrect: false
  - snippet: |-
      export interface IntegrationConfig {
        apiKey: string;
        baseUrl: string;
      }

      export function createIntegrationClient(config: IntegrationConfig) {
        if (!config.apiKey) throw new Error("apiKey is required");
        return { baseUrl: config.baseUrl, authHeader: `Bearer ${config.apiKey}` };
      }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
