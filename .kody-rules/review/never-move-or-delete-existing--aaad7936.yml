title: Never move or delete existing app support.html URLs
rule: >-
  Existing `<slug>/support.html` pages are permanent App Store Connect contract
  URLs. Never move, rename, or delete an existing `<slug>/support.html` (or the
  `<slug>/` directory that hosts it). Any refactor, cleanup, or re-template must
  keep these paths byte-for-byte stable so the App Store listing links keep
  resolving. When adding a new app, create a NEW `<slug>/` directory rather than
  restructuring existing ones.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      # Adding a new app
      cp -r _template/ mynewapp/
      python3 scripts/build_catalog.py
      # existing codecaps/support.html, clutch/support.html untouched
    isCorrect: true
  - snippet: |-
      # Cleanup: consolidate all support pages into /support/<slug>.html
      git mv codecaps/support.html support/codecaps.html
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
