title: Write the shared quota-windows.json only via LocalQuotaSnapshot.write
rule: >-
  The handoff file at `~/Library/Application Support/Usage
  Monitor/quota-windows.json` is shared with the running instance of the app, so
  it must be written only through `LocalQuotaSnapshot.write` (which creates the
  file private 0600 and writes via rename). Never use `Data.write(.atomic)` — or
  any other direct write — for this path, because the atomic write breaks the
  0600 permission / rename contract the running app depends on.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      // Correct: private 0600 + rename through the shared helper
      LocalQuotaSnapshot.write(snapshot)
    isCorrect: true
  - snippet: |-
      // Wrong: bypasses the 0600 + rename contract
      let data = try JSONEncoder().encode(snapshot)
      try data.write(to: handoffURL, options: .atomic)
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
