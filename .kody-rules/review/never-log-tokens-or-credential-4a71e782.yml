title: Never log tokens or credentials; only safeIssues may reach the handoff file
rule: >-
  CodeCaps never asks for or stores provider API keys — it reads the local files
  the AI CLIs already write. Therefore tokens and credentials must never be
  logged, printed, or included in any debug output or error surface. When
  surfacing provider problems, only the issues that pass
  `LocalQuotaSnapshot.safeIssues` may reach the on-disk handoff file. Any new
  reader, publisher, client, or view that touches auth material must be reviewed
  to confirm no token, key, or raw provider payload is emitted to logs or
  persisted.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      // Sanitize before persisting/surfacing
      let issues = LocalQuotaSnapshot.safeIssues(from: rawProviderIssues)
      try LocalQuotaSnapshot.write(issues)
    isCorrect: true
  - snippet: |-
      // Leaks credential material
      print("Claude token: \(accessToken)")
      logger.debug("raw response: \(rawResponse)")
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
