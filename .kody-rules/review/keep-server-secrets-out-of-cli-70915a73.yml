title: Keep server secrets out of client bundles
rule: >-
  Never reference server-only environment variables (DATABASE_URL,
  BETTER_AUTH_SECRET, SENTRY_AUTH_TOKEN, etc.) from client-side code or from
  modules that are imported by client components. Access them only inside
  server-only modules (e.g., createServerFn handlers, *.server.ts) via a
  validated server env module. Only non-sensitive values may use the VITE_
  prefix.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: >-
      // src/components/DealList.tsx

      const db = new Pool({ connectionString: import.meta.env.VITE_DATABASE_URL
      });
    isCorrect: false
  - snippet: |-
      // src/server/db.ts
      import { env } from './env';
      export const db = new Pool({ connectionString: env.DATABASE_URL });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
