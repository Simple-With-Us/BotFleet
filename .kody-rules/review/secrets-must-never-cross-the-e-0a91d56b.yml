title: Secrets must never cross the Electron IPC boundary or be hardcoded
rule: >-
  API keys, tokens, OAuth client secrets, and credential-store values must be
  read and used only inside the Electron main process or the local server. Do
  not hardcode secrets in source, do not return raw secrets from
  `ipcMain.handle` handlers, and do not expose them through
  `contextBridge`/preload. When the renderer needs to know about a credential,
  expose only a derived non-sensitive value (boolean, masked suffix, provider
  name) and perform the privileged call in the main process. Persist secrets via
  the OS keychain / existing credential store rather than plaintext config or
  `.env` files committed to the repo.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: >-
      ipcMain.handle('get-openai-key', () => process.env.OPENAI_API_KEY);

      contextBridge.exposeInMainWorld('api', { getKey: () =>
      ipcRenderer.invoke('get-openai-key') });
    isCorrect: false
  - snippet: |-
      const OPENAI_API_KEY = 'sk-live-abc123';
      export const client = new OpenAI({ apiKey: OPENAI_API_KEY });
    isCorrect: false
  - snippet: >-
      ipcMain.handle('chat', async (_e, messages) => runModel(messages)); // key
      stays in main

      contextBridge.exposeInMainWorld('api', {
        chat: (messages) => ipcRenderer.invoke('chat', messages),
        hasOpenAiKey: () => ipcRenderer.invoke('has-openai-key'), // boolean only
      });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
