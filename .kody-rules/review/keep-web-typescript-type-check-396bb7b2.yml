title: 'Keep web TypeScript type-checked: no silent type escapes'
rule: >-
  The web workspace exposes a typecheck script, so type errors must be fixed
  rather than suppressed. Do not add @ts-ignore, @ts-nocheck, @ts-expect-error,
  or `as any` casts to silence the compiler, and do not widen values to `any` to
  bypass checking (use `unknown` plus an explicit narrowing/validation helper).
  Any suppression requires a narrow @ts-expect-error with a written reason on
  the same line; blanket file-level disables are not allowed.
severity: medium
scope: file
path: '**/*'
examples:
  - snippet: |-
      // @ts-nocheck
      const icon = response.data.brand.icon as any;
      renderIcon(icon);
    isCorrect: false
  - snippet: |-
      const parsed = IconSchema.safeParse(response.data);
      if (!parsed.success) {
        return <FallbackIcon />;
      }
      renderIcon(parsed.data.brand.icon);
    isCorrect: true
  - snippet: const width = (props as any).size ?? 48;
    isCorrect: false
  - snippet: 'const width = typeof props.size === "number" ? props.size : 48;'
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
