title: Regenerate XcodeGen project and install via scripts/install.sh
rule: >-
  `XcodeGen` (`project.yml`) is the project source of truth and the generated
  `HogHunter.xcodeproj/` is git-ignored, so always run `xcodegen generate` after
  editing `project.yml` before building. `Info.plist` is auto-generated
  (`GENERATE_INFOPLIST_FILE: YES`) with no checked-in file, so bundle IDs and
  names must flow from build variables. Prefer `scripts/install.sh` over the
  manual build steps: it builds Release, signs with the "Developer ID
  Application" identity when it is in the keychain (adhoc otherwise), quits the
  running copy, installs, and relaunches. It installs to `/Applications` by
  default when a copy is already there, otherwise to `~/Applications`; pass
  `--dest PATH` to choose explicitly, `--dry-run` to preview without touching
  the running app or destination, or `--no-launch` to skip the relaunch. Tests
  (`HogHunterTests`, XCTest, `Tests/HogHunterTests/`) cover pure logic such as
  `HogFormat` and the iPhone snapshot codec and must be run with `xcodebuild
  -scheme HogHunter -destination 'platform=macOS' test`; CI
  (`.github/workflows/ci.yml`) runs the same on every push to `main` and every
  pull request, then builds the `HogHunterIOS` scheme for the iOS Simulator.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: >-
      cd ~/apps/HogHunter

      xcodegen generate

      xcodebuild -scheme HogHunter -configuration Release -derivedDataPath build

      ditto build/Build/Products/Release/HogHunter.app
      /Applications/HogHunter.app
    isCorrect: false
  - snippet: >-
      After editing `project.yml`: run `xcodegen generate`, then
      `scripts/install.sh` (add `--dry-run` to preview)
    isCorrect: true
  - snippet: xcodebuild -scheme HogHunter -destination 'platform=macOS' test
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
