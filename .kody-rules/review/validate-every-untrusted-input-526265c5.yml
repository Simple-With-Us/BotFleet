title: Validate every untrusted input with a zod schema at the trust boundary
rule: >-
  Any data crossing into the app from outside its own type system — HTTP request
  bodies/params in the local server, IPC payloads from the renderer, YAML/JSON
  config files, webhook payloads, and responses from external services — must be
  parsed with a zod schema (`.safeParse` or `.parse`) before it is used,
  persisted, or forwarded. Do not destructure or index into unvalidated objects,
  and do not cast with `as` to silence type errors on boundary data. Return a
  4xx / reject the IPC call when validation fails rather than proceeding with
  partial input.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      app.post('/api/agents', async (req, res) => {
        const { name, model, tools } = await req.json();
        await db.insertAgent({ name, model, tools });
        res.json({ ok: true });
      });
    isCorrect: false
  - snippet: |-
      const AgentInput = z.object({
        name: z.string().min(1).max(64),
        model: z.string().min(1),
        tools: z.array(z.string()).max(32).default([]),
      });

      app.post('/api/agents', async (req, res) => {
        const parsed = AgentInput.safeParse(await req.json());
        if (!parsed.success) return res.status(400).json({ error: parsed.error.flatten() });
        await db.insertAgent(parsed.data);
        res.json({ ok: true });
      });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
