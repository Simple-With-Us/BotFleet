title: No secrets, tokens, or production credentials in Playwright specs or fixtures
rule: >-
  E2E specs, fixtures, and helper modules must never embed real credentials, API
  keys, session tokens, cookies, or customer/PII data. Read environment-specific
  values from environment variables (or a git-ignored .env loaded by the test
  runner) and fail fast with a clear error when a required variable is missing.
  Use synthetic fixture data for dashboard records instead of copies of real
  fleet/customer data, and never point the tests at a production host or
  production API base URL.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: >-
      const adminToken = 'Bearer
      eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.PROD_TOKEN';

      await page.goto('https://fleet-ops.prod.example.com/login');
    isCorrect: false
  - snippet: >-
      const token = process.env.FLEET_OPS_TEST_TOKEN;

      if (!token) throw new Error('FLEET_OPS_TEST_TOKEN is required to run the
      e2e suite');

      await page.goto('/login'); // baseURL points at the local/staging serve
      instance
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
