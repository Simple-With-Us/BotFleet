title: Never expose API key values or pairing tokens outside the owner's Terminal
rule: >-
  Secret material must never leave the owner's machine. Do NOT read values from
  `~/.secrets/global-api-keys` into chat — reference key names only. Never paste
  the live one-time pairing token into chat, a commit, or a board row; use
  `MiniMax-Companion --print-token` (which prints `host`, `port`, and the
  read-only live token with no rotation and no port bind) and have the owner run
  that command in their own Terminal. This matters because headless pairing has
  no scannable QR — under launchd the QR lands in
  `~/Library/Logs/MiniMax-Companion.log`, which a phone cannot scan, so the
  token is the only fallback and is exactly the value that must stay local.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: >-
      MiniMax-Companion --print-token

      # prints host, port, and the live one-time token read-only; owner runs
      this in their own Terminal
    isCorrect: true
  - snippet: >-
      // agent: pasted the `--print-token` output into Slack #agent-sync and
      into the PR description so the owner could pair
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
