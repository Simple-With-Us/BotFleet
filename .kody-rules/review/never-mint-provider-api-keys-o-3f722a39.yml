title: >-
  Never mint provider API keys or expose secret values — secret hygiene is
  binding for every agent
rule: >-
  Secrets are the owner's, never the agent's: no agent, on any platform (Claude
  Code, Codex, Antigravity/Gemini, Cursor, Monet, cloud seats) or any sub-agent,
  may create, mint, rotate, or regenerate a provider API key in ANY provider
  console/API (OpenRouter, OpenAI, Anthropic, Pinecone, Voyage, FMP, …), and
  must not swap in a key from another app, workspace, or its own MCP
  provisioning — the owner maintains exactly one intended key per provider per
  app with deliberate spend caps and rate guardrails. If a key is missing,
  wrong, exhausted, or rejected: STOP and tell the owner what you observed and
  which key you believe is in play, identified only by its masked first-8/last-4
  preview (the Connections page /console/connections#api-keys and
  /admin/llm-usage per-key `keyRef` show this without revealing a value) — never
  paste a key value; the owner supplies keys via the chmod 600 handoff in
  /Users/jay/.secrets/. Additional binding hygiene: never grep a secrets handoff
  file for `KEY=` lines — `grep '^[A-Z0-9_]+='` / `grep '^ADMIN'` / `rg TOKEN
  file` print every value into the transcript, use names-only `grep -oE
  '^[A-Z][A-Z0-9_]*' ~/.secrets/global-api-keys`; never `cat` or open
  ~/.secrets/global-api-keys with a Read tool; never run bare `infisical
  secrets` (it prints every value) — use `scripts/infisical-secrets-safe.sh`,
  and its `set` subcommand refuses LLM runtime names. Infisical is the sole
  source of truth (strict-Infisical, 2026-09-18): no `.env`, `.env.local`,
  `.env.*`, `.env.yml`, or `.env.yaml` anywhere — only the committed
  bootstrap-only `.env.example`; local dev runs `npm run dev:secrets`, and
  `test/no-env-loader-or-dotenv-yaml.test.ts` is the regression guard. Do NOT
  put LLM runtime keys (OPENAI_API_KEY, ANTHROPIC_API_KEY, XAI_API_KEY,
  GEMINI_API_KEY, MISTRAL_API_KEY, DEEPSEEK_API_KEY, MOONSHOT_API_KEY,
  OPENROUTER_API_KEY, or siblings) into Infisical for this app — they belong on
  Connections (infra knobs like GEMINI_RPM_LIMIT and OPENROUTER_ADMIN_KEY are
  not this class). Never store the full-privilege `COOLIFY_AGENTS` token as the
  app's `COOLIFY_API_TOKEN` (that must be the read-only `COOLIFY_SERVER_STATS`
  token). Do not reintroduce env-based re-seeding over a delete tombstone in
  `migrateLocalEnvCredentials` (`src/lib/db-api-keys.ts`).
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: >-
      OpenRouter returned 401 for the app key, so I minted a fresh
      OPENROUTER_API_KEY in the provider console and ran `infisical secrets set
      OPENROUTER_API_KEY=...`.
    isCorrect: false
  - snippet: >-
      The key in play looks like `sk-or-v1-3f9a…b71c` (masked first-8/last-4). I
      am stopping here and asking the owner to supply the replacement via the
      chmod 600 handoff in /Users/jay/.secrets/ rather than minting a second
      key.
    isCorrect: true
  - snippet: >-
      `grep -oE '^[A-Z][A-Z0-9_]*' ~/.secrets/global-api-keys` to list which
      secret names exist, then `scripts/infisical-secrets-safe.sh` for any
      read/set.
    isCorrect: true
  - snippet: >-
      `grep '^ADMIN' ~/.secrets/global-api-keys` to see which admin tokens are
      configured.
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
