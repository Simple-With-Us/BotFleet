title: Treat all icon/contact data as untrusted — no raw HTML or SVG injection
rule: >-
  Icon SVGs, avatar URLs, and contact fields originate from remote sources, so
  they must never be inserted into the DOM as raw markup. Do not use
  dangerouslySetInnerHTML, innerHTML, outerHTML, or document.write with fetched
  or user-supplied content. Render SVG through sanitized React elements or an
  explicit sanitizer (e.g. DOMPurify with the SVG profile) before injection, and
  validate/whitelist remote image URLs instead of echoing them back into the
  page.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      function BrandIcon({ svgMarkup }: { svgMarkup: string }) {
        return <div dangerouslySetInnerHTML={{ __html: svgMarkup }} />;
      }
    isCorrect: false
  - snippet: |-
      import DOMPurify from "dompurify";

      function BrandIcon({ svgMarkup }: { svgMarkup: string }) {
        const safeSvg = DOMPurify.sanitize(svgMarkup, {
          USE_PROFILES: { svg: true, svgFilters: true },
        });
        return <div dangerouslySetInnerHTML={{ __html: safeSvg }} />;
      }
    isCorrect: true
  - snippet: element.innerHTML = contact.notes;
    isCorrect: false
  - snippet: element.textContent = contact.notes;
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
