title: Every exported schema or utility ships with tests and must typecheck
rule: >-
  Any change that adds or modifies an exported schema, type, or utility in this
  package must include corresponding Vitest coverage in the same change: at
  least one valid-input case and one invalid-input case (asserting the thrown
  error or failed safeParse) for each new schema, plus edge cases (empty
  strings, wrong types, extra/unknown keys for strict schemas) for parsing
  utilities. Exports must be reachable from the package entry point
  (src/index.ts) so consumers and tests exercise the same surface. The change
  must pass `npm run test` and `npm run typecheck` with no new `any`,
  `@ts-ignore`, or `@ts-expect-error` used to bypass errors.
severity: medium
scope: pull-request
path: '**/*'
examples:
  - snippet: >-
      // src/index.ts

      export { TradeRecordSchema } from "./schemas/trade";


      // src/schemas/trade.ts

      export const TradeRecordSchema = z.object({ id: z.string(), amount:
      z.number() }).strict();

      // no test file added for TradeRecordSchema
    isCorrect: false
  - snippet: |-
      // src/index.ts
      export { TradeRecordSchema, type TradeRecord } from "./schemas/trade";

      // src/schemas/trade.test.ts
      import { describe, expect, it } from "vitest";
      import { TradeRecordSchema } from "./trade";

      describe("TradeRecordSchema", () => {
        it("accepts a valid record", () => {
          expect(TradeRecordSchema.safeParse({ id: "t1", amount: 10 }).success).toBe(true);
        });

        it("rejects unknown keys and bad types", () => {
          expect(TradeRecordSchema.safeParse({ id: "t1", amount: "10" }).success).toBe(false);
          expect(TradeRecordSchema.safeParse({ id: "t1", amount: 10, extra: 1 }).success).toBe(false);
        });
      });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
