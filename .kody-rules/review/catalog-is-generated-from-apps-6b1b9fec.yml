title: >-
  Catalog is generated from apps/index.json — run build_catalog.py and work in a
  worktree, never edit the main checkout
rule: >-
  `apps/index.json` is the single public source of truth for platform
  availability and product actions; do not hand-edit generated availability
  blocks on the homepage or product pages. Any change to the app list must: (1)
  update `apps/index.json`, (2) run `python3 scripts/build_catalog.py` to
  regenerate the homepage and each product detail availability block (CI runs it
  with `--check`), and (3) open a PR against `main` (which auto-deploys via
  GitHub Pages). New app landing pages are created by copying `_template/` to
  `<slug>/` at the repo root, replacing brand mark/copy/links, adding `<link
  rel="canonical">` plus an Open Graph block to the `<head>`, and adding an
  Apache-2.0 attribution block at the bottom of `index.html` linking back to the
  upstream fleet repo. All MM-side work must happen in per-seat worktrees at
  `~/apps/simplewithus-mm-<lane>` on branches following `mm/<lane>`; never edit
  `~/Code/Simple-With-Us` directly because the daemon resets it.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      # in ~/apps/simplewithus-mm-lane2 on branch mm/lane2
      # edit apps/index.json
      python3 scripts/build_catalog.py
      git checkout -b mm/lane2 && git commit -am "add DealDex availability"
      # open PR against main
    isCorrect: true
  - snippet: |-
      # directly in ~/Code/Simple-With-Us on main
      vim index.html   # hand-edited the availability table
      python3 scripts/build_catalog.py --check   # fails in CI
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
