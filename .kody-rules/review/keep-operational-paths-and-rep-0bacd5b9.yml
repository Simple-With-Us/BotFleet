title: Keep operational paths and repository links out of public pages and docs
rule: >-
  This repository publishes the public marketing site at
  `https://simplewithus.com/`. Hosting/routing inventory, private operations
  workspaces, local filesystem paths (e.g. `/Users/jay/...`), and fleet
  repository links must never appear in public pages or public docs. Keep
  operational paths and repository links in private workspaces/agent memory
  only; only publish brand-safe product copy, canonical links, and Open Graph
  metadata on the site. Do not link to unlisted wildcard labels (`local.`,
  `client.`, `remote.`, or any other label not claimed by a Pages site).
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      <head>
        <link rel="canonical" href="https://simplewithus.com/botfleet/">
        <meta property="og:title" content="BotFleet">
      </head>
    isCorrect: true
  - snippet: >-
      <p>Deployed from /Users/jay/apps/simplewithus-mm-lane1 and served by
      jaywedgeworth22/BotFleet on GitHub Pages. See client.simplewithus.com for
      staging.</p>
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
