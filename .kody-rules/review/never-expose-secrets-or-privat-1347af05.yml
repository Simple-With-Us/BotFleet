title: >-
  Never expose secrets or private infrastructure values; reuse existing fleet
  env vars
rule: >-
  Never print, paste, or commit secrets. Never paste secrets into chat, never
  invent keys in git, and never run bare `infisical secrets`. `~/.secrets/` is
  handoff-only. Refer to credentials only by name: `CLOUDFLARE_FLEET_API_TOKEN`
  (DNS record edits) and `CLOUDFLARE_JAY_API_KEY` + `mail@jays.services`
  (redirect rules on the Usage.Jays.Services account) — never print those
  values. Reuse the env vars already present in the fleet rather than adding new
  ones: `DD_API_KEY` (alias `DATADOG_API_KEY`), `DD_SITE` (`us5.datadoghq.com`),
  `DD_APPLICATION_ID`, `DD_CLIENT_TOKEN`, `DD_SERVICE` (default
  `personal-site`), `DD_ENV`, `DD_VERSION`,
  `DD_AGENT_HOST`/`DD_TRACE_AGENT_PORT`. Production (`VERCEL_ENV=production`)
  and `DD_FAIL_CLOSED=1` fail closed when keys are missing — do not hide
  rendered errors to work around it. Observability is Datadog only: do not add
  `@sentry/*`, a DSN, or a Sentry project, and never enable Datadog Session
  Replay (RUM Session Replay stays at 0; prod APM sample rate 0.2; code in
  `site/src/lib/datadog/`, verify with `node scripts/verify-datadog.mjs`).
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      echo $CLOUDFLARE_FLEET_API_KEY
      DD_API_KEY=abc123def456 npm run dev
    isCorrect: false
  - snippet: >-
      Reuse DD_API_KEY / DD_APPLICATION_ID / DD_CLIENT_TOKEN from the fleet env;
      reference CLOUDFLARE_JAY_API_KEY by name only.

      node scripts/verify-datadog.mjs
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
