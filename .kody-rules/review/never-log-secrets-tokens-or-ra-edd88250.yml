title: Never log secrets, tokens, or raw request/response payloads
rule: >-
  Logging inside Workers must emit structured, redacted data only. Do not pass
  `env` bindings, authorization/cookie headers, query-string tokens, or full
  request/response bodies to `console.log`/`console.error`/`console.warn`
  (Workers Logs and `wrangler tail` capture these). Log an event name plus
  non-sensitive identifiers (route, method, status, duration, a hashed or
  truncated request id), and when a payload must be recorded, whitelist the
  specific safe fields instead of spreading the object. Errors should be logged
  with a stable message/code, not with the serialized request context.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      export default {
        async fetch(request: Request, env: Env): Promise<Response> {
          console.log("incoming", request.headers.get("Authorization"), env);
          const body = await request.clone().text();
          console.error("payload", body);
          return new Response("ok");
        },
      };
    isCorrect: false
  - snippet: |-
      export default {
        async fetch(request: Request, env: Env): Promise<Response> {
          const url = new URL(request.url);
          console.log(JSON.stringify({
            event: "fleet.request",
            route: url.pathname,
            method: request.method,
          }));
          return new Response("ok");
        },
      };
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
