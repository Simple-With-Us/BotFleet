title: Never hardcode secrets or tokens in web or Swift sources
rule: >-
  Do not commit API keys, tokens, credentials, or private endpoints in source
  files. In the web app, read configuration at build time via import.meta.env
  (Vite) and only expose values intended to be public (prefixed VITE_); anything
  secret must stay server-side or be injected at runtime. In Swift, read secrets
  from the Keychain or an untracked xcconfig/Info.plist key, never from a
  literal in code. Any string literal that looks like a key, bearer token, or
  connection string must be replaced with an environment/config lookup before
  merging.
severity: critical
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      const MAPS_API_KEY = "AIzaSyD-1a2b3c4d5e6f7g8h9i0jKlMnO";
      fetch(`https://maps.example.com/api?key=${MAPS_API_KEY}`);
    isCorrect: false
  - snippet: |-
      // server-only code (route handler or worker), never the client bundle
      const MAPS_API_KEY = process.env.MAPS_API_KEY;
      if (!MAPS_API_KEY) throw new Error("MAPS_API_KEY is not configured");
      fetch(`https://maps.example.com/api?key=${MAPS_API_KEY}`);
    isCorrect: true
  - snippet: |-
      let apiToken = "sk_live_9f8e7d6c5b4a3210"
      let client = APIClient(token: apiToken)
    isCorrect: false
  - snippet: |-
      let apiToken = try Keychain.read(.contactLogoAPIToken)
      let client = APIClient(token: apiToken)
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
