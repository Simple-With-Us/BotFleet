title: Wire protocol changes must be atomic across doc, DTOs, and consumers
rule: >-
  `docs/WIRE-PROTOCOL.md` is THE contract: both the iOS app and the Mac
  companion server implement it, and neither side may change shape without
  updating the doc in the same commit. When you change an endpoint, follow this
  exact order: (1) update `docs/WIRE-PROTOCOL.md` first, (2) update
  `CompanionCore/Sources/CompanionCore/DTOs.swift`, (3) update the consumer
  (`ios/App/...` or `companion/Sources/...`), and (4) bump `protocol` in
  `/v1/info` if the change is breaking. Never let the doc, the shared DTOs, and
  the two consumers drift apart in separate commits, and never add an
  undocumented endpoint, field, or error code. Do not reverse-engineer the Mavis
  Code wire format into this app — the companion server is the bridge;
  reverse-engineering belongs in the owner's private notes file and only lands
  in this repo if explicitly opt-in.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      If you change an endpoint:
      1. Update `docs/WIRE-PROTOCOL.md` first.
      2. Update `CompanionCore/Sources/CompanionCore/DTOs.swift`.
      3. Update the consumer (`ios/App/...` or `companion/Sources/...`).
      4. Bump `protocol` in `/v1/info` if the change is breaking.
    isCorrect: true
  - snippet: >-
      // Added a new `drive.thumbnail` field to the iOS decoder and the
      companion encoder, but left docs/WIRE-PROTOCOL.md and DTOs.swift
      untouched.
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
