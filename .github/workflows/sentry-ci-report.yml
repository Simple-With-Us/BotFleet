name: Sentry CI Report

# Fleet-wide CI observability: receives completion events from the observed
# workflows, but only reserves a runner for failures or scheduled check-ins.
# It reports those actionable events to the shared `fleet-infra` Sentry project
# (org simple-with-us).  ADDITIVE ONLY — this file must never modify the behavior
# of the workflows it observes.
#
# Two independent signals per completed run:
#   1. On conclusion == failure / timed_out / startup_failure: a Sentry error
#      event, tagged with {app, workflow, branch, actor}, carrying the run URL,
#      fingerprinted on [ci-failure, app, workflow] so every failure of one
#      workflow groups into ONE Sentry issue instead of paging separately every
#      time.  The branch is a TAG only, never a fingerprint component (it was
#      until 2026-08-12, which minted a permanent issue per feature branch —
#      ~85 of the fleet's unresolved fleet-infra issues).  The `app` tag +
#      fingerprint component are REQUIRED: the fleet-infra project is shared
#      across repos, and this repo shares workflow names ("CI", "Security",
#      "Effort Issues Sync") with peer apps, so without `app` a "CI" failure
#      here would dedup into the same Sentry issue as a "CI" failure there.
#      See AGENT-SYNC.md "Observability".
#   2. On event == schedule (i.e. the completed run was a cron-triggered
#      run of a workflow that defines `schedule:`): a Sentry Crons check-in
#      (ok on success, error on failure) with an upsert monitor_config whose
#      schedule mirrors that workflow's own cron expression, slug
#      `ci-botfleet-<workflow-slug>`.  This means a nightly/weekly job that
#      silently STOPS firing (not "runs and fails" but "never runs again")
#      raises a missed-check-in alert instead of going unnoticed.
#
# Raw Sentry envelope HTTP via python3 — no action marketplace dependency, no
# new job permissions beyond what's needed to read the triggering run.
#
# workflows observed (from `ls .github/workflows/` — see the `name:` header
# of each file; re-verify this list whenever a workflow is added, renamed, or
# removed, since a stale entry here silently disables alerting for that
# pipeline):
#   CI,
#   iOS TestFlight ship (GitHub-hosted macOS),
#   Package Ubuntu,
#   Validate Desktop Packages,
#   Release,
#   Sentry Deploy
#
# `iOS TestFlight Release` (`ios-testflight.yml`) was the entry here through
# 2026-09-04; that workflow was deleted the same day and replaced by
# `ios-ship.yml` ("iOS TestFlight ship (GitHub-hosted macOS)"), which is what
# this list now names.  FLEET-INFRA-CM ("no CRON_SCHEDULES entry for
# scheduled workflow 'iOS TestFlight Release'") is stale for the same
# reason — that workflow name matches nothing on `main` any more.
#
# DELIBERATELY NOT observed:
#   - Sentry CI Report (this file) — would recurse.
#
# Cron schedules mirrored for the check-in step (must match the source
# workflow's `schedule:` block AND its `name:`; keep in sync if those change).
# The reporter validates these keys against the real workflow names on every
# run and raises a Sentry issue on drift, so a rename cannot silently kill a
# monitor:
#   CI -> "17 9 * * 1" (ci.yml)
#   iOS TestFlight ship (GitHub-hosted macOS) -> "18,48 * * * *" (ios-ship.yml)
#
# Secret: `SENTRY_FLEET_DSN` (the fleet-infra project DSN) comes from
# Infisical prod through the shared composite action
# (.github/actions/infisical-secrets), with the repo's Actions secret of the
# same name as a synced GH_FALLBACK_ during the cutover.  Name only — never
# commit or print the value.  The reporter exits 0 with a warning when it is
# absent everywhere, so CI itself is never red-X'd by a missing DSN.
#
# Gold copy: Usage-Monitor origin/main (PR #1394).  Adapted for BotFleet.

on:
  workflow_run:
    workflows:
      # Names must match the `name:` field of workflow files exactly —
      # a stale entry here silently disables alerting for that pipeline.
      - CI
      - iOS TestFlight ship (GitHub-hosted macOS)
      - Package Ubuntu
      - Validate Desktop Packages
      - Release
      - Sentry Deploy
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sentry-ci-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  # The script has no side effect for an ordinary successful push/PR/manual
  # run.  Gate those events before runner scheduling so observability cannot
  # starve CI with guaranteed no-op jobs.  Keep this list in lockstep with
  # ALERT_CONCLUSIONS in scripts/sentry-ci-report.py.  Every scheduled run
  # remains eligible because Sentry Crons needs both success and error
  # check-ins.
  report:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure' ||
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (for the reporter script only; does not touch observed workflows)
        # Deliberately no `ref:` override: actions/checkout defaults workflow_run events to the
        # repo's default branch (main), NOT the head ref of the triggering run.  That's intentional
        # here — it means this step always executes the trusted, merged copy of the reporter
        # script rather than whatever version lives on an arbitrary (possibly fork/PR) branch that
        # triggered the observed workflow.  Do not add `ref: ${{ github.event.workflow_run.head_sha }}`
        # without re-reviewing the security implications.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # SENTRY_FLEET_DSN is a non-identity name behind Infisical, with the
      # synced GitHub secret as a GH_FALLBACK_ during the cutover.  Not
      # `required` -- the reporter itself already warns and exits 0 on a
      # missing DSN (see the file header) so CI is never red-X'd over it.
      - name: Load the fleet-infra Sentry DSN
        uses: ./.github/actions/infisical-secrets
        with:
          names: SENTRY_FLEET_DSN
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_SENTRY_FLEET_DSN: ${{ secrets.SENTRY_FLEET_DSN }}

      - name: Report failure + cron check-in to Sentry fleet-infra
        shell: bash
        env:
          SENTRY_FLEET_DSN: ${{ env.SENTRY_FLEET_DSN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/sentry-ci-report.py
