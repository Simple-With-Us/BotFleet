name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - run: pnpm exec playwright install --with-deps chromium
      # Runs tests/e2e: the smoke spec plus the Playwright visual screenshot
      # assertions (tests/e2e/visual.spec.ts) for the web surfaces.
      - name: Playwright tests (smoke + visual)
        run: pnpm test:e2e
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
