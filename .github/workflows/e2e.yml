name: E2E smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The Playwright suite (tests/e2e) covers the web shell only, so it runs
  # when the web app itself could have changed — not on iOS/electron-only
  # PRs. Includes the automated visual screenshot assertions
  # (tests/e2e/visual.spec.ts): web UI changes must be covered by those,
  # never by manual owner screenshots.
  changes:
    name: Classify E2E scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web_changed: ${{ steps.scope.outputs.web_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Scope compares commit/tree metadata, without historical file blobs.
          filter: blob:none
          persist-credentials: false
      - name: Check whether web-app paths changed
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Fail open: any event we cannot diff takes the full run, matching
          # the docs_only classifier in ci.yml.
          if [[ "$EVENT_NAME" != "push" && "$EVENT_NAME" != "pull_request" ]]; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The same scope ci.yml's classifier uses:  the pull request's own
          # two ends,  the branch point to the head.  Diffing from the stored
          # base SHA to the merge commit folded main's newer commits into the
          # scope,  so a documentation-only pull request looked like a web
          # change and paid for the whole Playwright suite.
          scope_paths="$(mktemp)"
          trap 'rm -f "$scope_paths"' EXIT
          if ! bash scripts/ci-scope-diff.sh "$BASE_SHA" "$HEAD_SHA" > "$scope_paths"; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -zEq '^(src|shared|tests/e2e|public)/|^(index\.html|vite\.config\.ts|playwright\.config\.ts|package\.json|pnpm-lock\.yaml)$' "$scope_paths"; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_changed=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: changes
    if: needs.changes.outputs.web_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # The tv-face visual fixture plays the blue skin's real GIFs; they are
      # git-LFS pointers without this pull (the onError chain then settles on
      # a still and the spec's first-paint assertions fail).
      - run: git lfs pull --include "public/tv-face/skins/blue/**"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - name: Usage grid visual fixture stays out of the production bundle
        run: |
          if grep -R --include='*.js' -F -q 'usage-grid-empty-placeholder' dist; then
            echo 'production dist still contains the usage grid visual fixture' >&2
            exit 1
          fi
      - name: Build the web shell in test mode for Playwright
        run: pnpm exec vite build --mode test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-failures
          path: test-results/
          retention-days: 7
      - name: Upload App task context screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-app-context-screenshots
          path: test-results/**/task-app-context-*.png
          if-no-files-found: ignore
          retention-days: 7
