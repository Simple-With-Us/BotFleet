name: iOS TestFlight ship (GitHub-hosted macOS)

# Archive + upload on GitHub-hosted macos-latest (fleet protocol 2026-08-24:
# GH-hosted runners for iOS ships; local Mac self-hosted runners are not
# the primary path). Unsigned compile stays in ci.yml. Fork PRs never run
# here. The wrapper is invoked with no extra flags.
#
# Signing + ASC keys come from Infisical prod (BotFleet project, type=shared)
# through .github/actions/infisical-secrets (scripts/infisical-fetch.mjs --
# no CLI install, no dependency). Identity stays on GitHub only:
#   INFISICAL_PROJECT_ID and INFISICAL_IOS_SHIP_READ_TOKEN -- a read-only
#   service token scoped to this project, environment and folder, in place
#   of the machine identity this pipeline used to hold.
# After should_ship=1 the job loads into GITHUB_ENV (masked):
#   APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8_BASE64,
#   IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD (all required -- the ship fails
#   without them), plus SENTRY_DSN and SENTRY_AUTH_TOKEN (best-effort, with
#   a synced GitHub secret as GH_FALLBACK_*; an inert Sentry beats a red ship).
# scripts/ios-appstore-gm-prepare.sh checks the five signing names and imports
# the Distribution identity;  the ship step reads the APPLE_API_* names directly.
# Hosted ships use MANUAL Release signing: scripts/ios-install-appstore-profiles.sh
# reuses or creates IOS_APP_STORE profiles over the App Store Connect API
# (asc-api.mjs ensure-appstore-profiles), installs them, and archives with the
# profile names in ios/appstore-profiles.json.  Values are never printed.
# Do not mint a new API key.  Leftover GitHub APPLE_/IOS_ secrets stay for cleanup.
#
# The in-repo wrapper prefers scripts/ios-fleet/, then
# /Users/jay/apps/ios-fleet. App key `botfleet`, bundle `app.botfleet.ios`,
# team `CC8UTF7ATG`. Versioning is 1.0.<commit count>, and CFBundleVersion is
# that same integer (owner 2026-10-18); UTC timestamps are retired.
#
# The build number is planned ONCE per release, by the plan-build job below
# (owner 2026-10-29): one shared merge-timestamp build, max(S, M + 1), where
# S is the committer date of HEAD in America/Chicago as YYYYMMDDHHMM and M
# is the highest build already in App Store Connect. The ship job receives
# that single value as its --build and never plans its own, so a release
# cannot upload two different builds.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ship.yml'
      - '.github/workflows/sentry-testflight.yml'
      - 'scripts/sentry-report-testflight.mjs'
      - 'scripts/sentry-testflight-receipt.mjs'
      - 'scripts/ios-fleet/**'
      - 'scripts/ios-ship-testflight.sh'
      - 'scripts/ios-appstore-gm-prepare.sh'
      - 'scripts/ios-install-appstore-profiles.sh'
  workflow_dispatch:
  schedule:
    # Twice an hour, offset from Socratic.Trade ('*/30'), Congress.Trade
    # ('7,37'), DealDex ('22,52'), and Usage-Monitor ('13,43').
    - cron: '18,48 * * * *'

# WHY THE CRON EXISTS, AND WHY IT NEEDS A GATE
# --------------------------------------------
# `push:` alone is not a reliable trigger. A PR merged by github-actions[bot]
# lands on main under GitHub's recursion guard and dispatches NOTHING (measured
# on Socratic.Trade PR #2675 and Congress.Trade PR #1835). So iOS code can
# reach main and never reach a phone, and the cron is what notices.
#
# But a cron carries no `paths:` filter, and the ship script's own gate only
# knows "is HEAD the sha I last shipped" plus a time interval -- neither of
# which knows whether ios/ changed. The "Scheduled ship gate" step below is
# what stops that. Hosted runners have an empty home each job, so
# ~/.cache/ios-fleet is restored from actions/cache. A scheduled tick with
# no last-ship file skips (first ship is a push that passed paths: or an
# explicit workflow_dispatch).

permissions:
  contents: read

concurrency:
  group: ios-ship-botfleet
  cancel-in-progress: false

jobs:
  plan-build:
    name: Plan the shared release build (once)
    if: github.event.repository.fork == false
    # No Xcode here: --plan-build-only exits before the toolchain
    # requirements, so this runs on a plain Ubuntu runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      # Default depth is enough: the plan reads only HEAD (its committer
      # date is the merge stamp S), never the history behind it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same names the ship job loads: the plan consults App Store Connect,
      # so it authenticates the same way. Values are masked, never printed.
      - name: Load Infisical signing secrets
        uses: ./.github/actions/infisical-secrets
        with:
          names: >-
            APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64
            IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD SENTRY_DSN SENTRY_AUTH_TOKEN
          required: >-
            APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64
            IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          token: ${{ secrets.INFISICAL_IOS_SHIP_READ_TOKEN }}
        env:
          GH_FALLBACK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GH_FALLBACK_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Plan the shared release build
        id: plan
        run: |
          build="$(bash scripts/ios-ship-testflight.sh --plan-build-only)"
          if [[ ! "$build" =~ ^[1-9][0-9]{11}$ ]]; then
            echo "::error::plan-build produced no 12-digit merge-timestamp build"
            exit 1
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  ship:
    name: TestFlight archive + upload
    needs: plan-build
    if: github.event.repository.fork == false
    # GitHub-hosted `xcode-27` image (actions/runner-images#14404): the iOS 27
    # deployment floor needs the iOS 27 SDK, which macos-latest (Xcode 26.x)
    # lacks.  DEVELOPER_DIR pins stable Xcode 27.0; the image also carries
    # 27.1/27.2 betas, which App Store review rejects.
    runs-on: xcode-27
    timeout-minutes: 90
    outputs:
      sentry_receipt: ${{ steps.ship.outputs.sentry_receipt }}
      sentry_receipt_error: ${{ steps.ship.outputs.sentry_receipt_error }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. The default depth-1
      # checkout leaves the runner workspace with exactly ONE commit, so
      # `git log <last-shipped-sha>..HEAD` fails with "unknown revision" and
      # both the scheduled gate and TestFlight release notes go empty.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore iOS ship state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-botfleet-${{ github.run_id }}
          restore-keys: |
            ios-fleet-botfleet-

      # Runs FIRST so a tick with nothing to ship costs seconds and cannot go
      # red on an unrelated environment problem. The logic lives in a script,
      # not inline YAML, so Ubuntu CI can unit-test it on every PR.
      - name: Scheduled ship gate (skip unless iOS code changed)
        id: gate
        run: |
          # One --path-prefix per on.push.paths entry above: the cron
          # backstop ships exactly what a push would have shipped, so a
          # merge the push trigger missed still ships (owner 2026-10-29).
          bash "$GITHUB_WORKSPACE/scripts/ios-fleet/scheduled-ship-gate.sh" \
            --event "${{ github.event_name }}" \
            --path-prefix 'ios/**' \
            --path-prefix '.github/workflows/ios-ship.yml' \
            --path-prefix '.github/workflows/sentry-testflight.yml' \
            --path-prefix 'scripts/sentry-report-testflight.mjs' \
            --path-prefix 'scripts/sentry-testflight-receipt.mjs' \
            --path-prefix 'scripts/ios-fleet/**' \
            --path-prefix 'scripts/ios-ship-testflight.sh' \
            --path-prefix 'scripts/ios-appstore-gm-prepare.sh' \
            --path-prefix 'scripts/ios-install-appstore-profiles.sh' \
            --repo-root "$GITHUB_WORKSPACE" \
            botfleet

      - name: Assert stable Xcode (never beta)
        if: steps.gate.outputs.should_ship == '1'
        run: |
          bash scripts/ios-assert-xcode.sh 27.0
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode version: ${ver}"
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac
          if xcodebuild -version | grep -qi beta; then
            echo "::error::xcodebuild reports a beta Xcode toolchain"
            exit 1
          fi
          os=$(sw_vers -productVersion)
          build=$(sw_vers -buildVersion)
          echo "macOS ${os} (${build})"
          if echo "$build" | grep -Eq '[0-9][a-z]$'; then
            echo "::error::macOS ${os} build ${build} is a beta host. App Store rejects these as INVALID_BINARY."
            exit 1
          fi

      - name: Install xcodegen
        if: steps.gate.outputs.should_ship == '1'
        run: |
          # ios/BotFleet.xcodeproj is gitignored. Hosted ships must generate it.
          bash scripts/ios-install-xcodegen.sh


      # Identity stays on GitHub.  Apple/iOS signing material and the Cocoa
      # Sentry DSN come from Infisical prod, through the one composite
      # action every packaging/ship workflow now shares (scripts/infisical-fetch.mjs
      # -- no CLI install, no dependency, runs identically on every OS).
      # SENTRY_DSN and SENTRY_AUTH_TOKEN are best-effort: an inert Sentry
      # beats a red TestFlight ship.  The five signing names are required --
      # there is nothing sane to fall back to for those.
      - name: Load Infisical signing secrets
        if: steps.gate.outputs.should_ship == '1'
        uses: ./.github/actions/infisical-secrets
        with:
          names: >-
            APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64
            IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD SENTRY_DSN SENTRY_AUTH_TOKEN
          required: >-
            APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64
            IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          token: ${{ secrets.INFISICAL_IOS_SHIP_READ_TOKEN }}
        env:
          GH_FALLBACK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GH_FALLBACK_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Do not use `secrets.*` in `if:` -- GitHub's dispatch parser rejects
      # that named-value (HTTP 422: Unrecognized named-value: 'secrets') and
      # the whole workflow dies at 0s with 0 jobs.  Same class as DealDex #175
      # and Usage-Monitor #1343. Check APPLE_API_KEY_ID from step env.
      - name: Import signing + ASC key
        if: steps.gate.outputs.should_ship == '1'
        run: |
          # Empty env means Infisical export missed the name. Do not mint a new key.
          if [ -z "${APPLE_API_KEY_ID:-}" ]; then
            echo "::error::APPLE_API_KEY_ID empty after Infisical prod export. Confirm the five Apple/iOS signing names exist in Infisical env=prod (APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8_BASE64, IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD). Do not mint a new key."
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"

      # Route through the in-repo wrapper. scripts/ios-ship-testflight.sh
      # execs scripts/ios-fleet/ship-testflight.sh (BotFleet apps.json is
      # app.botfleet.ios, 1.0.N).
      #
      # The build comes from the plan-build job: one shared value per
      # release, passed as --build and never re-planned here. Standing gate
      # is DEFAULT_MIN_INTERVAL_SEC=3600 (1 hour) in the fleet script. The
      # 30-minute cron picks up an unbuilt merge on the next eligible hour;
      # same-HEAD ticks still exit 0 without shipping.
      - name: Ship BotFleet to TestFlight
        id: ship
        if: steps.gate.outputs.should_ship == '1'
        env:
          IOS_TF_RELEASE_NOTES: "1"  # Jay 2026-09-08: publish ASC What to Test
          IOS_MANUAL_SIGN: "1"  # 2026-10-07: API profiles; no Xcode provisioning service
          # The fleet iOS version manifest lives in AI-Fleet-Coordinator, and
          # that repository's ruleset refuses a direct write to its protected
          # branch, so the publish is a branch plus a pull request.  The
          # workflow's own GITHUB_TOKEN is read-only by declaration and cannot
          # write to another repository, so the fleet's elevated token is
          # passed for that one step.  The publisher refuses GITHUB_TOKEN
          # outright, and it never arms auto-merge with one.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: bash scripts/ios-ship-testflight.sh --build "${{ needs.plan-build.outputs.build }}"

      # Standing TestFlight testers (asc-standing-testers skill): make sure the
      # three standing emails are in BotFleet's external beta group and the new
      # build is assigned (and submitted for Beta App Review when Apple needs
      # it).  Emails come from the ASC_STANDING_TESTERS secret, never from a
      # file in this public repo, and are masked in the log.  Idempotent, adds
      # only those emails, and a tester-sync problem is a loud warning, never a
      # red ship.  Uses the same APPLE_API_* key the ship step used.
      - name: Sync standing TestFlight testers
        if: success() && steps.gate.outputs.should_ship == '1'
        continue-on-error: true
        env:
          ASC_STANDING_TESTERS: ${{ secrets.ASC_STANDING_TESTERS }}
        run: |
          for e in $(printf '%s' "${ASC_STANDING_TESTERS:-}" | tr ',;' '  '); do
            echo "::add-mask::${e}"
          done
          set +e
          appleid="$(python3 -c 'import json;print(json.load(open("scripts/ios-fleet/apps.json"))["apps"]["botfleet"]["appleId"])')"
          appleid_rc=$?
          set -e
          if [ "$appleid_rc" -ne 0 ] || [ -z "$appleid" ]; then
            echo "::warning title=TestFlight standing testers::could not read the botfleet appleId from scripts/ios-fleet/apps.json (rc=${appleid_rc}); tester sync skipped.  The TestFlight upload itself succeeded."
            exit 0
          fi
          set +e
          node scripts/ios-fleet/asc-api.mjs ensure-standing-testers "$appleid"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=TestFlight standing testers::tester sync exited ${rc}; see the standing-testers lines above.  The TestFlight upload itself succeeded."
          fi

  report-sentry-deployment:
    needs: ship
    if: >-
      (needs.ship.outputs.sentry_receipt != '' || needs.ship.outputs.sentry_receipt_error == 'true') &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/sentry-testflight.yml
    with:
      receipt: ${{ needs.ship.outputs.sentry_receipt }}
      receipt_error: ${{ needs.ship.outputs.sentry_receipt_error == 'true' }}
    secrets: inherit
