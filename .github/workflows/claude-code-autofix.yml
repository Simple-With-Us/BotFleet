name: Claude Code Autofix

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to run the autofix loop on"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-autofix-${{ github.repository }}-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type == 'Bot' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: Simple-With-Us/AI-Fleet-Coordinator/.github/workflows/claude-code-autofix-reusable.yml@e37a3e3055fb616dbc0aaa1c2f127d8b34edbf46
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      META_MODEL_API_TOKEN: ${{ secrets.META_MODEL_API_TOKEN }}
      # Pass only secrets the reusable declares (MINIMAX_API_KEY, and GH_PAT,
      # which it ignores).  Any other name fails every run at startup with
      # "Invalid secret ... is not defined in the referenced workflow".  The
      # reusable pushes with GITHUB_TOKEN, so CI does not re-run on an autofix
      # commit;  re-push to re-trigger it (owner 2026-10-11:  no fleet workflow
      # acts as the owner's account).
      USAGE_INGEST_TOKEN: ${{ secrets.USAGE_INGEST_TOKEN }}
    with:
      # The reusable's default drops claude/claude[bot] (restored here) and no
      # default allows swu-echo, whose owner-directed dispatches were refused
      # ("Workflow initiated by non-human actor: swu-echo").  All swu-* bots are
      # trusted CI actors (owner 2026-10-20).
      allowed_bots: "chatgpt-codex-connector,chatgpt-codex-connector[bot],kody-ai,kody-ai[bot],cursor,cursor[bot],claude,claude[bot],sentry,sentry[bot],swu-echo,swu-echo[bot]"
      prompt: |
        You are the fleet's autofix bot.  A review bot (Codex, Kody, or Cursor) just reviewed this pull request.
        1. Read every unresolved review comment from that review.  For each, decide against the current code whether it is a real defect.
        2. Fix real defects with the smallest change that answers the comment.  Do not refactor unrelated code, rename things, or reformat files.
        3. Never edit files under .github/workflows, never add or print secrets, and never weaken a test to make it pass.
        4. Run this repo's verify command (below) and make sure it passes before committing.  If you cannot make it pass, commit nothing.
        5. Commit with a subject starting "autofix:" and push to the PR branch.  Stop after one round.
        6. If a comment is not a real defect or is unclear, change nothing for it.
        This repo's verify command: `pnpm typecheck && pnpm test`.

