# Windows installer and unsigned macOS app, built on native runners and
# retained only as workflow artifacts.
#
# Why this exists: releases are cut by hand from a Mac, which cannot build
# an NSIS installer (electron-builder needs wine, and a cross-built exe
# that never ran on Windows is exactly the artifact that looks fine and
# breaks in the field). So every release so far shipped Windows behind the
# mac build — different trees under one version number. Run this from the
# same commit as the mac build and attach the artifact to the release.
#
# Deliberately artifact-only: validation must not sign, notarize, draft a
# release, or publish through electron-builder.
name: Validate Desktop Packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the packaged app ships compiled JS, so a stale dist/ or dist-server/
      # would ride along unsigned-for and unsealed (the 0.1.15 "damaged"
      # incident) — a fresh checkout is clean, but be explicit
      - name: clean build outputs
        shell: bash
        run: rm -rf dist dist-server release
      - name: Resolve the Sentry DSN
        uses: ./.github/actions/infisical-secrets
        with:
          names: SENTRY_DSN VITE_SENTRY_DSN
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # Vite inlines VITE_SENTRY_DSN at build time, so it must be in the
      # environment before the package step runs.  Infisical/GitHub hold no
      # separate VITE_SENTRY_DSN today, so the Cocoa/Electron DSN doubles as
      # the web one -- the behavior this replaces, preserved here.  Never
      # fail the build over a missing DSN -- an inert Sentry beats a red
      # release.
      - name: Default VITE_SENTRY_DSN to SENTRY_DSN when unset
        if: env.VITE_SENTRY_DSN == ''
        shell: bash
        env:
          SENTRY_DSN: ${{ env.SENTRY_DSN }}
        run: |
          if [ -n "${SENTRY_DSN:-}" ]; then
            echo "::add-mask::$SENTRY_DSN"
            {
              echo "VITE_SENTRY_DSN<<VITE_SENTRY_DSN_EOF"
              printf '%s\n' "$SENTRY_DSN"
              echo "VITE_SENTRY_DSN_EOF"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::SENTRY_DSN and VITE_SENTRY_DSN are both empty after the Infisical prod export and the GitHub secret fallback.  This build packages with Sentry inert."
          fi
      - run: pnpm package:win
      - name: report what was built
        shell: bash
        run: |
          echo "version: $(node -p "require('./package.json').version")"
          echo "commit:  $(git rev-parse HEAD)"
          ls -lh release/*.exe release/*.yml 2>/dev/null || true
      # Three things silently produce an installer that builds fine and is
      # broken in the field, and none of them can be checked from the Mac the
      # release is cut on — the artifact carries only the .exe. So assert them
      # here, where the unpacked tree exists, and fail the build instead of
      # shipping it.
      - name: verify the packaged tree
        shell: bash
        run: |
          res=release/win-unpacked/resources
          fail=0
          # missing → utilityProcess.fork fails → the 🐭 "Couldn't start the
          # bot server" page
          [ -f "$res/server/index.js" ] || { echo "::error::missing $res/server/index.js"; fail=1; }
          # missing → the server has nothing to serve → black window
          [ -f "$res/ui/index.html" ] || { echo "::error::missing $res/ui/index.html"; fail=1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || {
            echo "::error::missing $res/cloudflared/cloudflared.exe"; fail=1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || {
            echo "::error::missing cloudflared Apache 2.0 license"; fail=1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || {
            echo "::error::missing cloudflared release provenance"; fail=1; }
          if [ -f "$res/cloudflared/cloudflared.exe" ]; then
            expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
            actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || {
              echo "::error::packaged cloudflared hash is $actual"; fail=1; }
            "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
              echo "::error::packaged cloudflared has the wrong version"; fail=1; }
          fi
          [ -f "$res/app-update.yml" ] || { echo "::error::missing $res/app-update.yml"; fail=1; }
          if [ -f "$res/app-update.yml" ]; then
            # `owner` and `repo` are separate keys in the generated file, and
            # only the repo was being checked — so a build that fell back to the
            # former owner would have passed this gate while the error message
            # claimed the owner was verified. Check both.
            grep -q "^owner: Simple-With-Us$" "$res/app-update.yml" || {
              echo "::error::app-update.yml does not point at Simple-With-Us/BotFleet releases"; fail=1; }
            grep -q "^repo: BotFleet$" "$res/app-update.yml" || {
              echo "::error::app-update.yml does not point at Simple-With-Us/BotFleet releases"; fail=1; }
            # while the build is unsigned, a publisherName makes
            # electron-updater reject every update as untrusted
            if grep -q "publisherName" "$res/app-update.yml"; then
              echo "::error::app-update.yml carries publisherName on an unsigned build"; fail=1
            fi
          fi
          echo "--- app-update.yml ---"; cat "$res/app-update.yml" 2>/dev/null || true
          exit $fail

      # index.js EXISTING is not the same as index.js RUNNING. 0.1.24 shipped a
      # server that died instantly on ERR_MODULE_NOT_FOUND because tsc left a
      # bare `zod` import in a tree that carries no node_modules — and the
      # existence check above passed it. Start the real packaged copy here,
      # where node_modules genuinely is not present.
      - name: start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          HOME="$RUNNER_TEMP/omb-smoke" USERPROFILE="$RUNNER_TEMP/omb-smoke" \
            OMB_PORT=21987 node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1; then
              echo "packaged server answered /api/health ✓"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          kill $pid 2>/dev/null || true
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  mac:
    name: unsigned macOS arm64 app
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the docs application
        run: pnpm --filter @botfleet/docs types:check && pnpm --filter @botfleet/docs build
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release
      - name: Build the unsigned app directory
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm package:prepare
          pnpm build:speech
          pnpm build:recorder
          pnpm build:cua
          pnpm exec electron-builder --mac --arm64 --dir --publish never -c.mac.identity=null
      - name: Verify the packaged launcher and resources
        run: |
          app=release/mac-arm64/BotFleet.app
          res="$app/Contents/Resources"
          launcher="$app/Contents/MacOS/BotFleet"

          node <<'EOF'
          const path = require("node:path");
          const electronBuilderRoot = path.dirname(require.resolve("electron-builder/package.json"));
          const version = require(require.resolve("app-builder-lib/package.json", {
            paths: [electronBuilderRoot],
          })).version;
          const [major, minor] = version.split(".").map(Number);
          if (!Number.isInteger(major) || !Number.isInteger(minor) ||
              major < 26 || (major === 26 && minor < 15)) {
            throw new Error(`app-builder-lib ${version} is below the patched 26.15.0 floor`);
          }
          console.log(`app-builder-lib ${version}`);
          EOF

          test -d "$app" && test ! -L "$app"
          test -f "$launcher" && test ! -L "$launcher" && test -x "$launcher"
          test "$(find "$app/Contents/MacOS" -mindepth 1 -maxdepth 1 -type f -print | wc -l | tr -d ' ')" = 1
          lipo -archs "$launcher" | grep -qw arm64
          file "$launcher"

          for path in \
            "$res/server/index.js" \
            "$res/ui/index.html" \
            "$res/cloudflared/cloudflared" \
            "$res/licenses/cloudflared-LICENSE.txt" \
            "$res/licenses/cloudflared-README.md" \
            "$res/cua-driver" \
            "$res/BotFleet Speech.app/Contents/MacOS/speech-helper" \
            "$res/BotFleet Recorder.app/Contents/MacOS/recorder-helper"; do
            test -f "$path" && test ! -L "$path" || {
              echo "::error::missing regular packaged resource $path"; exit 1; }
          done
          for path in \
            "$res/cloudflared/cloudflared" \
            "$res/cua-driver" \
            "$res/BotFleet Speech.app/Contents/MacOS/speech-helper" \
            "$res/BotFleet Recorder.app/Contents/MacOS/recorder-helper"; do
            test -x "$path" || { echo "::error::packaged helper is not executable: $path"; exit 1; }
          done

          OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs
          node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, path]) => !existsSync(path));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} packaged proxies resolve`);
          EOF

          for path in \
            "$res/cua-driver" \
            "$res/BotFleet Speech.app/Contents/MacOS/speech-helper" \
            "$res/BotFleet Recorder.app/Contents/MacOS/recorder-helper"; do
            lipo -archs "$path" | grep -qw x86_64
            lipo -archs "$path" | grep -qw arm64
          done
          test "$(lipo -archs "$res/cloudflared/cloudflared")" = arm64
          "$res/cloudflared/cloudflared" version | grep -Fq "cloudflared version 2026.8.2 "

          if codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application'; then
            echo "::error::validation artifact unexpectedly carries a Developer ID signature"
            exit 1
          fi
      - name: Archive the unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/BotFleet.app release/BotFleet-unsigned-arm64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: botfleet-unsigned-macos-arm64
          path: release/BotFleet-unsigned-arm64.zip
          if-no-files-found: error
          retention-days: 7
