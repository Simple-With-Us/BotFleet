name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled re-runs the ratchet when the allow label is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the ratchet can read the base branch baseline.
          # The default pull_request checkout is the merge commit
          # (refs/pull/<n>/merge).  Do not pin ref to the branch head.
          # A branch that is only behind the base must be linted as merged,
          # or the ratchet false-fails and seats regenerate the baseline.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Lint (no new anti-slop errors in changed files)
        if: github.event_name == 'pull_request'
        env:
          LINT_BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/lint-pr-gate.mjs
      - name: Lint (per-rule ratchet against the base branch)
        if: github.event_name == 'pull_request'
        env:
          LINT_BASELINE_REF: origin/${{ github.base_ref }}
          # Exact "1" opts in.  Any other value stays strict.
          # The label is the reviewable allow path.  Editing the JSON is not.
          LINT_BASELINE_ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-lint-baseline-increase') && '1' || '0' }}
        run: node scripts/check-lint-baseline.mjs --baseline-ref "$LINT_BASELINE_REF"
      - name: Lint (full repo)
        if: github.event_name != 'pull_request'
        run: pnpm lint
