# The native BotFleetMac release path (BF-2486, Phase 6): archive, Developer
# ID sign, notarize, staple, DMG, and the Sparkle appcast, from ONE pinned
# commit.  The default run only uploads a private Actions artifact.  A draft
# GitHub release is a separate explicit input, and this workflow never
# publishes: publishing stays the owner's click, exactly as in release.yml.
#
# Why a second workflow instead of a release.yml job: the two apps share the
# bundle identifier app.botfleet.macos, and their feeds are different formats
# (latest-mac.yml for electron-updater, appcast.xml for Sparkle) over
# disjoint asset names (BotFleet-* vs BotFleetMac-*).  One workflow per feed
# keeps either pipeline runnable while the other shell still ships, and the
# Phase 6 milestone retires release.yml only when the Electron shell does.
#
# Every gate below mirrors scripts/mac-package.sh, which see for the local
# path: codesign BEFORE notarization (notarization accepts invalid
# signatures), hashes and lengths AFTER stapling (stapling rewrites bytes),
# and the version stamped once in `prepare` from a full-history checkout.
#
# The native assets go on their OWN release, tagged native-v<version>, never
# on the Electron release for the same version.  release.yml asserts that
# v<version> carries exactly the Electron asset set and deletes every other
# asset it finds there, so a shared tag would fail that check in one order
# and lose the native bytes in the other.  The appcast points at the native
# tag, so the feed and the bytes stay in the same place.
#
# When this workflow gains push triggers, their paths must cover
# ios/MacApp/**, ios/Sources/**, ios/project.yml and this file, or a
# native-only change becomes unshippable (the C-86 lesson BF-2486 records).
name: Native Mac Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string
      draft:
        description: "Attach the verified native assets to the native-v<version> draft release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASES_REPO: Simple-With-Us/BotFleet

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # fetch-depth: 0 is REQUIRED: the version is 1.0.<commit_count>,
          # and a depth-1 clone counts 1.  The stamp script refuses shallow.
          fetch-depth: 0
          persist-credentials: false
      - id: pin
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Capture the stamp separately from the echo: an assignment takes
          # the status of the command substitution, so a failed stamp must
          # stop the job here instead of publishing an empty version that
          # fails much later, for an unrelated reason.
          version="$(node scripts/stamp-commit-version.mjs .)" || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published release
        if: ${{ inputs.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read this job's own pin output here, never the needs context:
          # inside the job that produces an output, needs is still empty,
          # which is how the release.yml guard silently never fired before
          # PR #1315 fixed it there.
          v="native-v${{ steps.pin.outputs.version }}"
          if gh release view "$v" --repo "$RELEASES_REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$v is already published on $RELEASES_REPO; refusing to add native assets to it"
            exit 1
          fi

  mac-native:
    name: BotFleetMac (sign, notarize, staple)
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a beta Xcode
        run: |
          xcodebuild -version
          if xcodebuild -version | grep -qi beta; then
            echo "::error::xcodebuild reports a beta Xcode toolchain"
            exit 1
          fi
      - name: Load the signing credentials with this app's service token
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_NATIVE_RELEASE_READ_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # This app reads the BotFleet project through ONE read-only service
          # token scoped to prod:/ (the root folder is the project's only
          # folder).  The shared infisical-secrets action authenticates with a
          # machine identity instead, so the fetch is inline here; that action
          # should grow a token input, and then this step goes away.
          [ -n "${INFISICAL_TOKEN:-}" ] || {
            echo "::error::INFISICAL_NATIVE_RELEASE_READ_TOKEN is not set"; exit 1; }
          payload="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${INFISICAL_TOKEN}" \
            --get \
            --data-urlencode "secretPath=/" \
            --data-urlencode "environment=prod" \
            --data-urlencode "workspaceId=${INFISICAL_PROJECT_ID}" \
            "https://app.infisical.com/api/v3/secrets/raw")"
          # The value is masked before it reaches GITHUB_ENV and never
          # reaches a command line: the here-strings expand in the shell.
          export_secret() {
            local name="$1" value="$2"
            cat <<< "::add-mask::$value"
            {
              printf '%s\n' "${name}<<INFISICAL_EOF"
              cat <<< "$value"
              printf '%s\n' "INFISICAL_EOF"
            } >> "$GITHUB_ENV"
          }
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD \
                      APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            value="$(jq -r --arg n "$name" '.secrets[] | select(.secretKey == $n) | .secretValue' <<< "$payload")"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::$name is missing from Infisical"
              exit 1
            fi
            export_secret "$name" "$value"
          done
          # The Sparkle key is optional: until the owner provisions it the
          # appcast ships unsigned and the app refuses unsigned items.
          sparkle="$(jq -r '.secrets[] | select(.secretKey == "SPARKLE_EDDSA_PRIVATE_KEY_B64") | .secretValue' <<< "$payload")"
          if [ -n "$sparkle" ] && [ "$sparkle" != "null" ]; then
            export_secret SPARKLE_EDDSA_PRIVATE_KEY_B64 "$sparkle"
          fi
      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          MAC_CERT_P12_BASE64: ${{ env.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ env.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # The base64 never reaches a command line: the here-string expands
          # in the shell, so a traced run cannot print the secret.
          base64 --decode <<< "$MAC_CERT_P12_BASE64" > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Generate the Xcode project
        run: |
          bash scripts/ios-install-xcodegen.sh
          cd ios
          xcodegen generate
      - name: Archive BotFleetMac
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          build="${VERSION##*.}"
          xcodebuild archive \
            -project ios/BotFleet.xcodeproj \
            -scheme BotFleetMac \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/BotFleetMac.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$build" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=CC8UTF7ATG
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BotFleetMac.xcarchive" \
            -exportOptionsPlist ios/ExportOptions-DeveloperID.plist \
            -exportPath "$RUNNER_TEMP/export"
      - name: "Gate: the signature must verify BEFORE notarization"
        run: |
          app="$RUNNER_TEMP/export/BotFleetMac.app"
          test -d "$app" || { echo "::error::export produced no BotFleetMac.app"; exit 1; }
          codesign --verify --deep --strict "$app"
          team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          test "$team" = "CC8UTF7ATG" || {
            echo "::error::BotFleetMac.app is signed by team '${team:-none}', not CC8UTF7ATG"; exit 1; }
          echo "ok: $app"
      - name: Notarize and staple the app
        env:
          APPLE_API_KEY_P8_BASE64: ${{ env.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ env.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ env.APPLE_API_ISSUER_ID }}
        run: |
          # The base64 never reaches a command line: the here-string expands
          # in the shell, so a traced run cannot print the secret.
          base64 --decode <<< "$APPLE_API_KEY_P8_BASE64" > "$RUNNER_TEMP/notary.p8"
          app="$RUNNER_TEMP/export/BotFleetMac.app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/submit.zip"
          # Capture the status separately, so the notary's own diagnostic is
          # printed before the step fails.  A bare assignment would exit on
          # the failed command substitution and swallow the reason.
          if ! out=$(xcrun notarytool submit "$RUNNER_TEMP/submit.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait 2>&1); then
            echo "$out"
            echo "::error::notarization failed for the app ZIP"
            exit 1
          fi
          echo "$out" | tail -2
          echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for the app ZIP"; exit 1; }
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"
          rm "$RUNNER_TEMP/notary.p8"
          echo "ok: notarized, stapled, Gatekeeper-clean"
      - name: Package the final ZIP and DMG from the stapled app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_API_KEY_P8_BASE64: ${{ env.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ env.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ env.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p native-upload
          app="$RUNNER_TEMP/export/BotFleetMac.app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "native-upload/BotFleetMac-$VERSION.zip"
          hdiutil create -volname "BotFleet" -srcfolder "$app" -ov -format UDZO \
            "native-upload/BotFleetMac-$VERSION.dmg" > /dev/null
          base64 --decode <<< "$APPLE_API_KEY_P8_BASE64" > "$RUNNER_TEMP/notary.p8"
          if ! out=$(xcrun notarytool submit "native-upload/BotFleetMac-$VERSION.dmg" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait 2>&1); then
            echo "$out"
            echo "::error::notarization failed for the DMG"
            exit 1
          fi
          echo "$out" | tail -2
          echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for the DMG"; exit 1; }
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "native-upload/BotFleetMac-$VERSION.dmg"
          xcrun stapler validate "native-upload/BotFleetMac-$VERSION.dmg"
      # Best-effort by design: until the owner provisions the EdDSA key in
      # Infisical (Phase 6 owner action), the appcast ships unsigned and the
      # verify step below runs without --require-signature.  An app carrying
      # SUPublicEDKey refuses unsigned items, so this fails closed.  The key
      # arrives with the service-token fetch above when it is provisioned.
      # sign_update is NOT on the runner image.  Without this step the
      # signing branch below is unreachable and the appcast can never be
      # signed from CI, whatever the owner provisions.
      - name: Install Sparkle's sign_update
        env:
          SPARKLE_VERSION: "2.10.1"
          SPARKLE_SHA256: "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27"
        run: |
          set -euo pipefail
          url="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/sparkle.tar.xz"
          echo "${SPARKLE_SHA256}  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP" ./bin/sign_update
          chmod +x "$RUNNER_TEMP/bin/sign_update"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Generate and verify the appcast over the final bytes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SPARKLE_EDDSA_PRIVATE_KEY_B64: ${{ env.SPARKLE_EDDSA_PRIVATE_KEY_B64 }}
        run: |
          zip="native-upload/BotFleetMac-$VERSION.zip"
          if [ -n "${SPARKLE_EDDSA_PRIVATE_KEY_B64:-}" ]; then
            # A provisioned key with no signing tool is a broken pipeline,
            # not an unsigned draft: fail here rather than publish a feed
            # the app will refuse.
            command -v sign_update > /dev/null || {
              echo "::error::sign_update is not installed; cannot sign the appcast"; exit 1; }
            # sign_update reads the EdDSA key from stdin when --ed-key-file
            # is "-", so the private key never reaches the filesystem and
            # never reaches a command line.
            signature=$(base64 --decode <<< "$SPARKLE_EDDSA_PRIVATE_KEY_B64" \
              | sign_update --ed-key-file - "$zip" \
              | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
            test -n "$signature" || { echo "::error::sign_update produced no signature"; exit 1; }
            printf '%s' "$signature" > "$zip.edsig"
            echo "Sparkle update signed"
          else
            echo "::warning::no Sparkle EdDSA signing (key unprovisioned); appcast is an unsigned draft"
          fi
          node scripts/native-appcast.mjs native-upload "$VERSION" "native-v$VERSION"
          if [ -f "$zip.edsig" ]; then
            node scripts/verify-native-release.mjs native-upload "$VERSION" --require-signature
            rm "$zip.edsig"
          else
            node scripts/verify-native-release.mjs native-upload "$VERSION"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-mac-release
          path: native-upload/
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Verify the native asset set
    needs: [prepare, mac-native]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-mac-release
          path: assets
      - name: Verify the appcast against the actual bytes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/verify-native-release.mjs assets "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: botfleet-native-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: assets
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Attach the native assets to the draft release
    if: ${{ inputs.draft }}
    needs: [prepare, assemble]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: botfleet-native-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: assets
      - name: Create or update the draft with the native asset set
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          cd assets
          # The native assets live on their OWN release, never on the
          # Electron release for the same version: release.yml asserts that
          # v<version> carries exactly the Electron asset set and deletes
          # anything else it finds there, so a shared tag would either fail
          # that check or lose the native bytes.
          tag="native-v$VERSION"
          if existing=$(gh api "repos/$RELEASES_REPO/releases/tags/$tag" 2>/dev/null); then
            is_draft=$(jq -r .draft <<< "$existing")
            if [ "$is_draft" != true ]; then
              echo "::error::$tag is already published; refusing to replace its assets"
              exit 1
            fi
          else
            gh release create "$tag" --repo "$RELEASES_REPO" \
              --draft --target "$SHA" --title "BotFleet $VERSION (native)" \
              --notes "Draft assembled by the release workflows.  Edit these notes, then publish."
          fi
          # Native names never collide with the Electron set, so --clobber
          # here can only replace this workflow's own earlier uploads.
          for f in BotFleetMac-*.zip BotFleetMac-*.dmg appcast.xml; do
            gh release upload "$tag" "$f" --repo "$RELEASES_REPO" --clobber
          done
          echo "native assets on $tag: $(gh release view "$tag" --repo "$RELEASES_REPO" --json assets --jq '[.assets[].name | select(startswith("BotFleetMac") or . == "appcast.xml")] | join(", ")')"
