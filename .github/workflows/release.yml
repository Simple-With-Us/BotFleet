# One-button release staging: builds macOS (arm64 + x64, signed, notarized,
# stapled), Windows, and Ubuntu from ONE commit, then verifies one complete
# artifact set.  The default run only uploads a private Actions artifact.
# Draft creation and publication are separate, explicit inputs.
#
# Publish target = the built-in GITHUB_TOKEN.  The job's `contents: write`
# (set just below) is the only extra scope the release steps need, and
# nothing in this repo listens for `released` events, so a fine-grained PAT
# adds rotation without buying anything.  Decision on 2026-09-18.
#
# Every gate below exists because its absence shipped (or nearly shipped) a
# broken build from a laptop:
#   - clean output dirs        -> 0.1.15 "app is damaged" (stale dist/ broke the seal)
#   - codesign gate BEFORE     -> notarization ACCEPTS invalid signatures
#   - packaged-server smoke    -> 0.1.24 died on launch (unbundled zod import)
#   - proxy-path probe         -> the 0.1.24 fix broke every helper while
#                                 /api/health stayed green
#   - staple, THEN hash        -> stapling rewrites bytes; stale feeds make
#                                 electron-updater reject every update
#   - blockmap regeneration    -> stale differential maps waste every updater's
#                                 bandwidth silently
#   - assemble-then-publish    -> 0.1.24 sat as an invisible draft; a mac-only
#                                 publish 404s the README's other buttons
#
# One-time signing setup is documented in docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string
      publish:
        description: "Publish immediately after assembly (also creates/updates the draft)"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create or update a GitHub draft release after artifact verification"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  # The one and only publish target. Must match electron-builder.yml
  # `publish`, or installed apps check a feed no release ever lands on.
  RELEASES_REPO: Simple-With-Us/BotFleet

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - id: pin
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published release
        if: ${{ inputs.draft || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" --repo "$RELEASES_REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$v is already published on $RELEASES_REPO — bump the version first"
            exit 1
          fi

  mac:
    name: macOS ${{ matrix.arch }} (sign, notarize, staple)
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            app: release/mac-arm64/BotFleet.app
            package_script: package:mac:arm64:release
            cloudflared_arch: arm64
          - arch: x64
            app: release/mac/BotFleet.app
            package_script: package:mac:x64:release
            cloudflared_arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release

      # Prefer the automation identity's Infisical values and accept the
      # same-named GitHub secrets as a migration fallback.  A release without
      # both values cannot be signed, so fail here with the missing names.
      # (Not optional: with them empty the import step below would decode an
      # empty .p12 and die inside `security import`, and the signature gate
      # after packaging would fail anyway -- a still-empty vault cannot make
      # this job green, so stop early with a message that names the secrets.
      # scripts/release-workflow.node-test.mjs asserts this `required:` line.)
      - name: Load the Developer ID certificate
        uses: ./.github/actions/infisical-secrets
        with:
          names: MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD
          required: MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          GH_FALLBACK_MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}

      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          MAC_CERT_P12_BASE64: ${{ env.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ env.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Resolve the Sentry DSN
        uses: ./.github/actions/infisical-secrets
        with:
          names: SENTRY_DSN VITE_SENTRY_DSN
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # Vite inlines VITE_SENTRY_DSN at build time, so it must be in the
      # environment before the package step runs.  Infisical/GitHub hold no
      # separate VITE_SENTRY_DSN today, so the Cocoa/Electron DSN doubles as
      # the web one -- the behavior this replaces, preserved here.  Never
      # fail the build over a missing DSN -- an inert Sentry beats a red
      # release.
      - name: Default VITE_SENTRY_DSN to SENTRY_DSN when unset
        if: env.VITE_SENTRY_DSN == ''
        shell: bash
        env:
          SENTRY_DSN: ${{ env.SENTRY_DSN }}
        run: |
          if [ -n "${SENTRY_DSN:-}" ]; then
            echo "::add-mask::$SENTRY_DSN"
            {
              echo "VITE_SENTRY_DSN<<VITE_SENTRY_DSN_EOF"
              printf '%s\n' "$SENTRY_DSN"
              echo "VITE_SENTRY_DSN_EOF"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::SENTRY_DSN and VITE_SENTRY_DSN are both empty after the Infisical prod export and the GitHub secret fallback.  This build packages with Sentry inert."
          fi

      - name: Package ${{ matrix.arch }}
        run: pnpm ${{ matrix.package_script }}

      - name: "Gate: the signature must verify BEFORE notarization"
        run: |
          app="${{ matrix.app }}"
          codesign --verify --deep --strict "$app"
          bin="$app/Contents/Resources/cloudflared/cloudflared"
          test -x "$bin" || { echo "::error::missing executable $bin"; exit 1; }
          test -f "$app/Contents/Resources/licenses/cloudflared-LICENSE.txt" \
            || { echo "::error::missing cloudflared license in $app"; exit 1; }
          test -f "$app/Contents/Resources/licenses/cloudflared-README.md" \
            || { echo "::error::missing cloudflared provenance in $app"; exit 1; }
          codesign --verify --strict "$bin"
          app_team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          bin_team=$(codesign -dv --verbose=4 "$bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          test -n "$app_team" && test "$bin_team" = "$app_team" || {
            echo "::error::cloudflared is not signed by the app's Developer ID team in $app"; exit 1; }
          echo "ok: $app"

      - name: "Gate: the packaged server starts and every helper path resolves"
        env:
          MAC_APP: ${{ matrix.app }}
          CLOUDFLARED_ARCH: ${{ matrix.cloudflared_arch }}
        run: |
          app="$MAC_APP"
          res="$app/Contents/Resources"
          # the server tree is plain JS — runnable on the runner's node
          # regardless of the app binary's arch
          OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
            || { echo "::error::packaged server in $app failed to start"; exit 1; }
          node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, p]) => !existsSync(p));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} proxies resolve in ${server}`);
          EOF
          for bin in "$res/cua-driver" "$res/BotFleet Speech.app/Contents/MacOS/speech-helper"; do
            lipo -archs "$bin" | grep -q "x86_64" || { echo "::error::$bin lacks x86_64"; exit 1; }
            lipo -archs "$bin" | grep -q "arm64" || { echo "::error::$bin lacks arm64"; exit 1; }
          done
          cloudflared="$res/cloudflared/cloudflared"
          expected_arch="$CLOUDFLARED_ARCH"
          test "$(lipo -archs "$cloudflared")" = "$expected_arch" || {
            echo "::error::$cloudflared is not the expected $expected_arch executable"; exit 1; }
          if [ "$(uname -m)" = "$expected_arch" ]; then
            "$cloudflared" version | grep -Fq "cloudflared version 2026.8.2 " || {
              echo "::error::$cloudflared has the wrong version"; exit 1; }
          fi

      # All three names are required -- with GH_FALLBACK_* covering the
      # cutover while the vault copies are confirmed (orchestrator step 3).
      - name: Load the notarization credentials
        uses: ./.github/actions/infisical-secrets
        with:
          names: APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID
          required: APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          GH_FALLBACK_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          GH_FALLBACK_APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Notarize this architecture's DMG and ZIP
        env:
          MAC_ARCH: ${{ matrix.arch }}
          APPLE_API_KEY_P8_BASE64: ${{ env.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ env.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ env.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          v=$(node -p "require('./package.json').version")
          for f in "release/BotFleet-$v-$MAC_ARCH.dmg" "release/BotFleet-$v-$MAC_ARCH.zip"; do
            out=$(xcrun notarytool submit "$f" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          rm "$RUNNER_TEMP/notary.p8"

      - name: Staple, re-zip, and regenerate blockmaps
        env:
          MAC_APP: ${{ matrix.app }}
          MAC_ARCH: ${{ matrix.arch }}
        run: |
          v=$(node -p "require('./package.json').version")
          xcrun stapler staple "release/BotFleet-$v-$MAC_ARCH.dmg"
          xcrun stapler staple "$MAC_APP"
          rm -f "release/BotFleet-$v-$MAC_ARCH.zip"
          ditto -c -k --sequesterRsrc --keepParent "$MAC_APP" "release/BotFleet-$v-$MAC_ARCH.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/BotFleet-$v-$MAC_ARCH.zip" "release/BotFleet-$v-$MAC_ARCH.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release-${{ matrix.arch }}
          path: |
            release/BotFleet-*-${{ matrix.arch }}.dmg
            release/BotFleet-*-${{ matrix.arch }}.zip
            release/BotFleet-*-${{ matrix.arch }}.dmg.blockmap
            release/BotFleet-*-${{ matrix.arch }}.zip.blockmap
          if-no-files-found: error
          retention-days: 7

  mac-merge:
    name: macOS updater feed and stable aliases
    needs: [prepare, mac]
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: mac-release-arm64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: mac-release-x64
          path: release
      - name: Require at least one signed mac artifact set
        run: |
          shopt -s nullglob
          files=(release/BotFleet-*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no mac release artifacts were produced"
            exit 1
          fi
          echo "mac artifacts: ${files[*]}"
      - name: Regenerate latest-mac.yml when both architectures built
        run: |
          v=$(node -p "require('./package.json').version")
          if [ -f "release/BotFleet-$v-arm64.dmg" ] && [ -f "release/BotFleet-$v-x64.dmg" ]; then
            node scripts/regenerate-mac-feed.mjs release/latest-mac.yml
          else
            echo "::warning::skipping latest-mac.yml — not every mac architecture built"
          fi
      - name: Stable-named copies for the README's /latest/download links
        run: |
          v=$(node -p "require('./package.json').version")
          if [ -f "release/BotFleet-$v-arm64.dmg" ]; then
            cp "release/BotFleet-$v-arm64.dmg" release/BotFleet.dmg
          fi
          if [ -f "release/BotFleet-$v-x64.dmg" ]; then
            cp "release/BotFleet-$v-x64.dmg" release/BotFleet-intel.dmg
          fi
      - name: Stage merged mac artifacts for upload
        run: |
          mkdir -p mac-upload
          shopt -s nullglob
          for f in release/BotFleet-*.dmg release/BotFleet-*.zip release/BotFleet-*.blockmap \
            release/BotFleet.dmg release/BotFleet-intel.dmg release/latest-mac.yml; do
            [ -e "$f" ] && cp "$f" mac-upload/
          done
          ls -la mac-upload/
          test "$(find mac-upload -type f | wc -l)" -gt 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release
          path: mac-upload/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - name: Resolve the Sentry DSN
        uses: ./.github/actions/infisical-secrets
        with:
          names: SENTRY_DSN VITE_SENTRY_DSN
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # Vite inlines VITE_SENTRY_DSN at build time, so it must be in the
      # environment before the package step runs.  Infisical/GitHub hold no
      # separate VITE_SENTRY_DSN today, so the Cocoa/Electron DSN doubles as
      # the web one -- the behavior this replaces, preserved here.  Never
      # fail the build over a missing DSN -- an inert Sentry beats a red
      # release.
      - name: Default VITE_SENTRY_DSN to SENTRY_DSN when unset
        if: env.VITE_SENTRY_DSN == ''
        shell: bash
        env:
          SENTRY_DSN: ${{ env.SENTRY_DSN }}
        run: |
          if [ -n "${SENTRY_DSN:-}" ]; then
            echo "::add-mask::$SENTRY_DSN"
            {
              echo "VITE_SENTRY_DSN<<VITE_SENTRY_DSN_EOF"
              printf '%s\n' "$SENTRY_DSN"
              echo "VITE_SENTRY_DSN_EOF"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::SENTRY_DSN and VITE_SENTRY_DSN are both empty after the Infisical prod export and the GitHub secret fallback.  This build packages with Sentry inert."
          fi
      - run: pnpm package:win
      - name: Verify the packaged tree and start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || { echo "::error::missing cloudflared.exe"; exit 1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || { echo "::error::missing cloudflared license"; exit 1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || { echo "::error::missing cloudflared provenance"; exit 1; }
          expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
          actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::cloudflared hash is $actual"; exit 1; }
          "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
            echo "::error::cloudflared has the wrong version"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
          grep -q "^owner: ${RELEASES_REPO%%/*}$" "$res/app-update.yml" || { echo "::error::wrong update repo owner"; exit 1; }
          grep -q "^repo: ${RELEASES_REPO##*/}$" "$res/app-update.yml" || { echo "::error::wrong update repo"; exit 1; }
          if grep -q "publisherName" "$res/app-update.yml"; then
            echo "::error::publisherName on an unsigned build breaks every update"; exit 1
          fi
          HOME="$RUNNER_TEMP/smoke" USERPROFILE="$RUNNER_TEMP/smoke" OMB_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1 && { kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1
      - name: Stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/BotFleet-$v-setup.exe" release/BotFleet-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Ubuntu 24.04 x64
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: pnpm clean
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Resolve the Sentry DSN
        uses: ./.github/actions/infisical-secrets
        with:
          names: SENTRY_DSN VITE_SENTRY_DSN
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # Vite inlines VITE_SENTRY_DSN at build time, so it must be in the
      # environment before the package step runs.  Infisical/GitHub hold no
      # separate VITE_SENTRY_DSN today, so the Cocoa/Electron DSN doubles as
      # the web one -- the behavior this replaces, preserved here.  Never
      # fail the build over a missing DSN -- an inert Sentry beats a red
      # release.
      - name: Default VITE_SENTRY_DSN to SENTRY_DSN when unset
        if: env.VITE_SENTRY_DSN == ''
        shell: bash
        env:
          SENTRY_DSN: ${{ env.SENTRY_DSN }}
        run: |
          if [ -n "${SENTRY_DSN:-}" ]; then
            echo "::add-mask::$SENTRY_DSN"
            {
              echo "VITE_SENTRY_DSN<<VITE_SENTRY_DSN_EOF"
              printf '%s\n' "$SENTRY_DSN"
              echo "VITE_SENTRY_DSN_EOF"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::SENTRY_DSN and VITE_SENTRY_DSN are both empty after the Infisical prod export and the GitHub secret fallback.  This build packages with Sentry inert."
          fi
      - run: pnpm package:linux
      - name: Verify package contents and metadata
        run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Smoke the packages
        env:
          OMB_KEEP_SMOKE_DIR: "1"
          OMB_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge botfleet || true
      - name: Stable-named copies and checksums
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/BotFleet-$v-amd64.deb" release/BotFleet-amd64.deb
          cp "release/BotFleet-$v-x86_64.AppImage" release/BotFleet.AppImage
          (cd release && sha256sum "BotFleet-$v-amd64.deb" "BotFleet-$v-x86_64.AppImage" > SHA256SUMS-ubuntu-x64.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-ubuntu-x64.txt
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble and verify every feed
    needs: [prepare, mac-merge, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Verify every feed hash against the actual bytes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/verify-release-assets.mjs assets "$VERSION"
      - name: Preserve the complete verified release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: botfleet-release-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: assets
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create the GitHub release
    if: ${{ inputs.draft || inputs.publish }}
    needs: [prepare, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: botfleet-release-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: assets
      - name: Create or update the draft with the complete asset set
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node scripts/verify-release-tag.mjs
          cd assets
          tag="v$VERSION"
          notes="Draft assembled by the release workflow from $RELEASES_REPO@$SHA.  Edit these notes, then publish."
          if existing=$(gh api "repos/$RELEASES_REPO/releases/tags/$tag" 2>/dev/null); then
            is_draft=$(jq -r .draft <<< "$existing")
            existing_target=$(jq -r .target_commitish <<< "$existing")
            if [ "$is_draft" != true ]; then
              echo "::error::$tag is already published; refusing to replace its assets"
              exit 1
            fi
            if [ "$existing_target" != "$SHA" ]; then
              echo "::error::$tag existing draft targets $existing_target, not pinned $SHA"
              exit 1
            fi
          else
            gh release create "$tag" --repo "$RELEASES_REPO" \
              --draft --target "$SHA" --title "BotFleet $VERSION" \
              --notes "$notes"
          fi
          while IFS= read -r old_asset; do
            if [ ! -f "$old_asset" ]; then
              gh release delete-asset "$tag" "$old_asset" --repo "$RELEASES_REPO" --yes
            fi
          done < <(gh release view "$tag" --repo "$RELEASES_REPO" --json assets --jq '.assets[].name')
          for f in *; do
            gh release upload "$tag" "$f" --repo "$RELEASES_REPO" --clobber
          done
          echo "$RELEASES_REPO asset count: $(gh release view "$tag" --repo "$RELEASES_REPO" --json assets --jq '.assets | length')"

      - name: Download and verify the uploaded draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir uploaded
          gh release download "v$VERSION" --repo "$RELEASES_REPO" --dir uploaded
          node scripts/verify-release-assets.mjs uploaded "$VERSION"

      - name: Publish (only when asked to)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "v$VERSION" --repo "$RELEASES_REPO" --draft=false --latest
          # a draft that LOOKS published is the 0.1.24 failure mode — verify
          gh release view "v$VERSION" --repo "$RELEASES_REPO" --json isDraft --jq .isDraft | grep -q false
          echo "v$VERSION is live on $RELEASES_REPO"
