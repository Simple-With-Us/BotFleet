# actions/labeler configuration for BotFleet.
# Labels a pull request `ui` when it touches a user-interface surface.
# The `ui` label exists in the repository (created Oct 27, 2026) so the
# action can apply it.
ui:
  - changed-files:
      - any-glob-to-any-file:
          # Web app (React + CSS).
          - 'src/**/*.tsx'
          - 'src/**/*.css'
          - 'src/components/**'
          # iOS / macOS SwiftUI view layer.
          - 'ios/App/**'
          - 'ios/MacApp/**'
          - 'ios/Widgets/**'
          # TV face player and shipped static assets.
          - 'tv-face/**'
          - 'public/**'
