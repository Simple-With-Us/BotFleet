packages:
  - "."
  - "apps/docs"
  - "apps/site"
allowBuilds:
  electron: true # postinstall downloads the Electron dist
  esbuild: true # postinstall validates the platform binary
  "@sentry/cli": true # postinstall fetches the platform sentry-cli binary (vite source maps)
  "@sentry/node-cpu-profiler": true # native addon for @sentry/profiling-node
  electron-winstaller: false # unused — Windows builds ship NSIS
  "@deepseek-ai/dsh-subprocess-local": false
  "@google/genai": false
  core-js: false
  koffi: false
  node-pty: false
  protobufjs: false
  workerd: false
overrides:
  "@xmldom/xmldom@0.8.13": "0.8.15"
  "js-yaml@4.3.1": "5.5.0"
  "lodash-es": "4.18.1"
  "sharp@0.35.2": "0.35.5"
  "sharp@0.35.3": "0.35.5"
patchedDependencies:
  clutch@0.4.0: patches/clutch@0.4.0.patch
supportedArchitectures:
  cpu:
    - "arm64"
    - "x64"
