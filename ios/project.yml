name: BotFleet
options:
  bundleIdPrefix: app.botfleet
  deploymentTarget:
    iOS: '27.0'
    macOS: '14.0'
  createIntermediateGroups: true
  projectFormat: xcode16_3
  xcodeVersion: '27.0'
  postGenCommand: bash ../scripts/ios-xcodegen-post.sh
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '27.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CC8UTF7ATG
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Native Sentry. Empty unless xcodebuild/CI passes SENTRY_DSN=...
    # Do not put a live DSN in this file or in Info.plist.
    SENTRY_DSN: ""
packages:
  CompanionCore:
    path: .
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 9.31.0
targets:
  BotFleet:
    type: application
    platform: iOS
    sources:
    - path: App
    - path: App/Assets.xcassets
    - path: Shared
    - path: Assets.xcassets
    dependencies:
    - target: BotFleetWidgets
      embed: true
    - package: CompanionCore
      product: CompanionCore
    - package: Sentry
      product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botfleet.ios
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        # RECORD OF WHAT SHIPPED, not the source of truth for what ships next:
        # the ship script passes both values on the xcodebuild command line, and
        # reads this one as the build-number FLOOR, so it must stay below the
        # commit count of any commit that can ship.
        # RECORD OF WHAT SHIPPED, not the source of truth for what ships next:
        # the ship script passes both values on the xcodebuild command line, and
        # reads this one as the build-number FLOOR, so it must stay below the
        # commit count of any commit that can ship.
        MARKETING_VERSION: "1.0.2222"
        CURRENT_PROJECT_VERSION: "2222"
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: false
        ENABLE_ON_DEMAND_RESOURCES: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
        # Mirrors info.properties for Xcode's General > App Category picker only.
        # The shipped value is LSApplicationCategoryType in App/Info.plist below
        # (INFOPLIST_KEY_* is ignored without GENERATE_INFOPLIST_FILE).
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Xcode General → Display Name reads INFOPLIST_KEY_* from build settings.
        INFOPLIST_KEY_CFBundleDisplayName: BotFleet
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "BotFleet iOS App Store (API)"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BotFleet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        SENTRY_DSN: $(SENTRY_DSN)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
        - CFBundleURLName: app.botfleet.companion.pairing
          CFBundleURLSchemes:
          - botfleet-ios
          - botfleet
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: BotFleet finds your computer on this network
          so your bots can reach you here.
        NSCameraUsageDescription: BotFleet uses the camera only to scan a pairing
          QR code shown on your computer.
        NSPhotoLibraryUsageDescription: BotFleet reads photos you choose to send in
          a chat. They are uploaded to your paired computer.
        UIBackgroundModes:
        - remote-notification
        - audio
        NSMicrophoneUsageDescription: BotFleet listens while you dictate a message
          to a bot.
        NSSpeechRecognitionUsageDescription: BotFleet converts your speech into text
          so you can send it to a bot. Recognition runs on this phone when it can.
        NSSpeechSynthesisUsageDescription: BotFleet uses your Personal Voice to speak
          bot responses aloud.
        NSBonjourServices:
        - _botfleet._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    entitlements:
      path: App/BotFleet.entitlements
      properties:
        com.apple.developer.associated-domains:
        - applinks:botfleet.app
        - webcredentials:botfleet.app
        com.apple.security.application-groups:
        - group.app.botfleet
        keychain-access-groups:
        - $(AppIdentifierPrefix)group.app.botfleet
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: production
  BotFleetWidgets:
    type: app-extension
    platform: iOS
    sources:
    - path: Widgets
    - path: Shared
    - path: Assets.xcassets
    - path: App/BotMascot.swift
    - path: App/BotFaceData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botfleet.ios.widgets
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.2222"
        CURRENT_PROJECT_VERSION: "2222"
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        ENABLE_ON_DEMAND_RESOURCES: false
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
        SKIP_INSTALL: true
        INFOPLIST_KEY_CFBundleDisplayName: BotFleet Widgets
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "BotFleet Widgets App Store (API)"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: BotFleet Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/BotFleetWidgets.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.botfleet
  BotFleetMac:
    type: application
    platform: macOS
    sources:
    - path: MacApp
    - path: Assets.xcassets
    dependencies:
    - package: CompanionCore
      product: CompanionCore
    - package: Sentry
      product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botfleet.macos
        # The product is BotFleet.app: it is the app this target replaces in
        # /Applications, and it carries the same bundle id the Electron
        # shell did, so it installs over it.  The TARGET is named BotFleetMac
        # only to tell it apart from the iOS app inside the project file; the
        # release assets keep the BotFleetMac- prefix so the Sparkle and
        # electron-updater feeds never share a name.
        PRODUCT_NAME: BotFleet
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.2222"
        CURRENT_PROJECT_VERSION: "2222"
        SWIFT_VERSION: '5.9'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        # Notarization refuses a bundle without the Hardened Runtime, and
        # Phase 6 ships this target only as a notarized Developer ID build
        # (scripts/mac-package.sh, native-mac-release.yml).
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_ON_DEMAND_RESOURCES: false
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: BotFleet
    info:
      path: MacApp/Info.plist
      properties:
        # These two keys must be declared here, not hand-edited into the
        # plist: `xcodegen generate` REWRITES ios/MacApp/Info.plist, and a
        # key it does not know about is reset to its default (1.0 / 1).  A
        # release stamped 1.0.<commit_count> would then ship as CFBundleVersion
        # 1, which disagrees with the appcast and starts a Sparkle update
        # loop.  Declaring them here makes the generated plist carry the
        # build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The same rewrite rule applies to the privacy strings: the Mac app
        # requests the microphone and speech recognition for voice capture, and
        # macOS TERMINATES an app that asks for a permission whose usage
        # description is missing.  Hand-editing them into the plist does not
        # survive `xcodegen generate`, which scripts/mac-package.sh and the
        # native release workflow both run before archiving, so the shipped
        # bundle would have no usage descriptions at all.  Declaring them here
        # makes the generated plist carry them into the archive.
        NSMicrophoneUsageDescription: BotFleet uses the microphone for dictation
          and voice calls with bots.
        NSSpeechRecognitionUsageDescription: BotFleet converts your speech into
          text for messaging bots.
        # Same rewrite rule again:  `xcodegen generate` REWRITES the plist, so a
        # hand-added CFBundleURLTypes is dropped before the archive is built and
        # macOS never delivers a botfleet:// URL to the app.  Without the scheme
        # the whole deep-link router is dead code, because the voice failure
        # recovery URL points at botfleet://settings/voice and the Application
        # menu routes the same way.  Declaring the scheme here makes the
        # generated plist register it.
        CFBundleURLTypes:
        - CFBundleURLName: app.botfleet.macos
          CFBundleURLSchemes:
          - botfleet
    entitlements:
      path: MacApp/BotFleetMac.entitlements
      properties:
        # Same rewrite rule as the Info.plist above: `xcodegen generate`
        # REWRITES ios/MacApp/BotFleetMac.entitlements, so a hand-edited
        # entitlement is dropped before the archive is built.  The Mac app
        # captures audio for voice, so declare the input entitlement here.
        com.apple.security.device.audio-input: true
schemes:
  BotFleet:
    build:
      targets:
        BotFleet: all
        BotFleetWidgets: all
    run:
      config: Debug
    archive:
      config: Release
  BotFleetMac:
    build:
      targets:
        BotFleetMac: all
    run:
      config: Debug
    archive:
      config: Release

