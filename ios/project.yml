name: BotFleet
options:
  bundleIdPrefix: app.botfleet
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  xcodeVersion: '26.3'
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CC8UTF7ATG
    # Native Sentry. Empty unless xcodebuild/CI passes SENTRY_DSN=...
    # Do not put a live DSN in this file or in Info.plist.
    SENTRY_DSN: ""
packages:
  CompanionCore:
    path: .
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 8.44.0
targets:
  BotFleet:
    type: application
    platform: iOS
    sources:
    - path: App
    - path: App/Assets.xcassets
    - path: Shared
    - path: Assets.xcassets
    dependencies:
    - target: BotFleetWidgets
      embed: true
    - package: CompanionCore
      product: CompanionCore
    - package: Sentry
      product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botfleet
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.30"
        CURRENT_PROJECT_VERSION: "202609010933"
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: false
        ENABLE_ON_DEMAND_RESOURCES: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BotFleet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        SENTRY_DSN: $(SENTRY_DSN)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
        - CFBundleURLName: app.botfleet.companion.pairing
          CFBundleURLSchemes:
          - botfleet
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: BotFleet finds your computer on this network
          so your bots can reach you here.
        NSCameraUsageDescription: BotFleet uses the camera only to scan a pairing
          QR code shown on your computer.
        NSPhotoLibraryUsageDescription: BotFleet reads photos you choose to send in
          a chat. They are uploaded to your paired computer.
        UIBackgroundModes:
        - remote-notification
        NSMicrophoneUsageDescription: BotFleet listens while you dictate a message
          to a bot.
        NSSpeechRecognitionUsageDescription: BotFleet converts your speech into text
          so you can send it to a bot. Recognition runs on this phone when it can.
        NSBonjourServices:
        - _botfleet._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    entitlements:
      path: App/BotFleet.entitlements
      properties:
        com.apple.developer.associated-domains:
        - applinks:botfleet.app
        - webcredentials:botfleet.app
        com.apple.security.application-groups:
        - group.app.botfleet
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: production
  BotFleetWidgets:
    type: app-extension
    platform: iOS
    sources:
    - path: Widgets
    - path: Shared
    - path: Assets.xcassets
    - path: App/BotMascot.swift
    - path: App/BotFaceData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botfleet.widgets
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.30"
        CURRENT_PROJECT_VERSION: "202609010933"
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        ENABLE_ON_DEMAND_RESOURCES: false
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
        SKIP_INSTALL: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: BotFleet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/BotFleetWidgets.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.botfleet
schemes:
  BotFleet:
    build:
      targets:
        BotFleet: all
        BotFleetWidgets: all
    run:
      config: Debug
    archive:
      config: Release
